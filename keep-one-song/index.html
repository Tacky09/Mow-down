<style>
/* Layout: a dark listening room. One centered stage, a 3-up record bin, fixed transport controls in the corners. */
:root{color-scheme:dark;--bg:#0b0a09;--panel:#151310;--line:#f4ead6;--gold:#ffc01e;--gold2:#c98a2b;--cream:#ffe3a6;--muted:#a79b86;--red:#e0523f;
--display:"Limelight","Playfair Display",Georgia,serif;--ui:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--line);font-family:var(--ui);letter-spacing:.04em;font-size:18px;overflow-x:hidden;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.disc{position:fixed;border-radius:50%;pointer-events:none;z-index:0;opacity:.28;
background:radial-gradient(circle,transparent 0 15%,var(--c) 15% 24%,transparent 24% 48%,#ffffff14 48% 49%,transparent 49% 69%,#ffffff08 69%)}
.disc.a{--c:var(--gold);width:520px;height:520px;left:-140px;top:30px;animation:spin 40s linear infinite}
.disc.b{--c:var(--red);width:460px;height:460px;right:-100px;bottom:-40px;animation:spin 52s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}.card{animation:none!important}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;align-items:center;gap:18px}
button{font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.tab{flex:1 1 150px;max-width:190px;min-height:40px;border:1.5px solid var(--cream);border-radius:6px;background:#1c1409;color:var(--cream);padding:8px 10px}
.tab[aria-pressed=true]{background:var(--gold);color:#17110a;border-color:var(--line)}
h1{font:400 clamp(58px,17vw,92px)/1.05 var(--display);margin:22px 0 10px;text-align:center;letter-spacing:.02em;
background:linear-gradient(#ffe9bb,#d8963a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #d8963a66);text-wrap:balance}
h2{font:400 clamp(30px,7vw,42px)/1.15 var(--display);margin:0;color:var(--gold);text-align:center;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:9px;width:min(262px,100%)}
.btn{min-height:44px;padding:8px 16px;border:1.5px solid var(--line);border-radius:6px;background:#0f0d0a;color:var(--gold);font-size:20px}
.btn.primary{background:var(--gold);color:#17110a;border-color:var(--gold)}
.btn:hover:not(:disabled){border-color:var(--gold)}
.lede{color:var(--muted);text-align:center;margin:0;max-width:44ch;letter-spacing:.05em}
.panel{border:1.5px solid var(--gold2);border-radius:8px;background:var(--panel);padding:30px 22px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;margin-top:8vh}
.panel p{margin:0;max-width:46ch}
.panel b{color:var(--gold);font-weight:400}
.yr{font:400 46px/1 var(--display);color:var(--gold);margin:30px 0 4px}
.yr small{display:block;font:400 15px var(--ui);color:var(--muted);letter-spacing:.08em;text-align:center;margin-top:8px}
.bin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;align-items:start}
.bin.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px}
@media (max-width:560px){.bin{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{display:flex;flex-direction:column;gap:8px;min-width:0;animation:drop .32s ease-out}
.card[hidden]{display:none}
@keyframes drop{from{transform:translateY(-10px);opacity:.2}}
.cover{position:relative;display:block;width:100%;aspect-ratio:1;max-width:100%;padding:0;border:3px solid var(--line);border-radius:6px;overflow:hidden;background:#000}
.card.on .cover{border-color:var(--gold);box-shadow:0 0 18px #ffc01e66}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.sleeve{position:absolute;inset:0;display:grid;place-items:center;background:var(--s)}
.sleeve i{width:82%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:repeating-radial-gradient(circle,#0c0c0c 0 3px,#1f1f1f 3px 4px);box-shadow:0 4px 18px #0009}
.sleeve em{width:42%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--l);color:#fff;font:400 clamp(15px,4vw,24px)/1 var(--display);font-style:normal}
.card.on .sleeve i{animation:spin 3s linear infinite}
.pp{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:#000c;border:1px solid var(--muted);display:grid;place-items:center;color:var(--gold);font-size:17px}
.meta{border:1.5px solid var(--line);border-radius:6px;background:var(--panel);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;flex:1}
.ttl{color:var(--cream);font-size:20px;line-height:1.1;overflow-wrap:anywhere}
.art{color:#d8d2c5;font-size:15px;line-height:1.1;overflow-wrap:anywhere}
.alb{color:var(--muted);font-size:13px;line-height:1.15;overflow-wrap:anywhere}
.alb:empty{display:none}
#backdrop{position:fixed;inset:-60px;z-index:0;pointer-events:none;background:center/cover no-repeat;filter:blur(30px) brightness(.42) saturate(1.25);opacity:0;transition:opacity .9s,background-image .9s}
#backdrop.on{opacity:1}
.save{background:var(--gold);color:#17110a;border:0;border-radius:4px;padding:6px 26px;min-height:34px;font-size:18px}
.save:disabled{background:#6d5416}
.listen{color:var(--muted);font-size:14px;text-underline-offset:3px}
.corner{position:fixed;z-index:5;display:flex;gap:8px;align-items:center}
.tl{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px))}
.bl{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:calc(12px + env(safe-area-inset-left,0px))}
.br{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.round{width:44px;height:44px;border-radius:50%;background:#0f0d0acc;border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.pill{min-height:44px;padding:0 14px;border-radius:22px;background:#0f0d0acc;border:1px solid var(--line);font-size:16px}
.pill[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
#vol{width:96px;accent-color:var(--gold)}
@media (max-width:480px){#vol{display:none}}
.note{color:var(--muted);font-size:15px;text-align:center;margin:0;max-width:60ch;letter-spacing:.05em}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;width:100%}
.years button{min-height:44px;background:var(--panel);border:1px solid #5a5040;border-radius:5px;color:var(--cream)}
.years button.done{border-color:var(--gold);color:var(--gold)}
.dec{width:100%;display:flex;flex-direction:column;gap:8px}
.dec h3{font:400 24px var(--display);color:var(--gold);margin:12px 0 0}
.row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid #2c271f}
.row b{font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums}
.rank{width:100%;display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:4px 10px;align-items:baseline}
.bar .t{min-width:0;overflow-wrap:anywhere}
.bar .t span{color:var(--muted);font-size:15px}
.bar .t mark{background:none;color:var(--gold)}
.bar .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--cream)}
.bar .fill{grid-column:1/-1;height:6px;background:#2c271f;border-radius:3px;overflow:hidden}
.bar .fill i{display:block;height:100%;background:var(--gold)}
select{font:inherit;background:var(--panel);color:var(--cream);border:1px solid var(--cream);border-radius:5px;padding:8px 10px;min-height:44px}
.big{font:400 96px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
#pause{position:fixed;inset:0;z-index:9;background:#000b;display:grid;place-items:center;padding:16px}
</style>
</head>

  pad=ac.createGain();pad.gain.value=0;pad.connect(ac.destination);
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=620;f.connect(pad);
  [110,164.81,220,261.63].forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.type='sawtooth';o.frequency.value=hz;o.detune.value=i*3-4;g.gain.value=.05;l.frequency.value=.07+i*.03;lg.gain.value=.03;l.connect(lg).connect(g.gain);o.connect(g).connect(f);o.start();l.start()})}
function duck(d){if(pad)pad.gain.setTargetAtTime(padOn&&!d?.16*vol:0,ac.currentTime,.4)}
$('#amb').onclick=()=>{padOn=!padOn;startPad();duck(!audio.paused);$('#amb').setAttribute('aria-pressed',padOn);$('#amb').textContent=padOn?'Mute room music':'Play room music'};
$('#vol').oninput=e=>{vol=e.target.value/100;audio.volume=vol;duck(!audio.paused)};

/* cards */
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7);
function cardHTML(song,i,label){const h=Math.abs(hash(song.t+song.a)),a=h%360,init=song.t.replace(/[^\p{L}\p{N}]/gu,'').slice(0,2).toUpperCase();
  const q=encodeURIComponent(cleanT(song.t)+' '+cleanA(song.a));
  return `<article class="card" data-i="${i}" hidden>
  <button class="cover" aria-label="Play ${esc(song.t)}"><span class="sleeve" style="--s:linear-gradient(${h%180}deg,hsl(${a} 55% 28%),hsl(${(a+50)%360} 60% 12%));--l:hsl(${(a+160)%360} 60% 42%)"><i><em>${esc(init)}</em></i></span><span class="pp" hidden>▶</span></button>
  <div class="meta"><span class="ttl">${esc(song.t)}</span><span class="art">${esc(song.a)}</span><span class="alb"></span>
  <button class="save" disabled>${label}</button>
  <a class="listen" href="https://music.youtube.com/search?q=${q}" target="_blank" rel="noopener">Listen</a></div></article>`}
function dressCard(el,info){if(!info)return;if(info.c&&!el.querySelector('img')){const im=new Image();im.alt='';im.src=info.c;im.onload=()=>{el.querySelector('.sleeve')?.remove();el.querySelector('.cover').prepend(im)}}
  if(info.al)el.querySelector('.alb').textContent=info.al;
  el.querySelector('.pp').hidden=false}
function playCard(el,info,clipMs){cardsOff();if(!info?.p)return false;el.classList.add('on');if(info.c){const b=$('#backdrop');b.style.backgroundImage='url("'+info.c+'")';b.classList.add('on')}el.querySelector('.pp').textContent='❚❚';audio.src=info.p;audio.currentTime=0;audio.play().catch(()=>{});duck(true);return true}
function bindCover(el,getInfo){const go=e=>{e.stopPropagation();const info=getInfo();if(!info?.p)return;if(el.classList.contains('on')&&!audio.paused){stopAudio()}else playCard(el,info)};el.querySelector('.cover').onclick=go}
audio.onended=()=>{cardsOff();duck(false)};

/* screens */
let view='home',token=0,round=null;
const chrome=(top,prev)=>{$('#ctl-tl').hidden=!top;$('#ctl-bl').hidden=!prev};
function leave(){token++;$('#backdrop').classList.remove('on');stopAudio();round=null;$('#pause').hidden=true;paused=false}
function home(){leave();view='home';chrome(false,false);const c=cur(),n=Object.keys(c.picks).length,tot=ed().years.length,res=n&&n<tot;
  app.innerHTML=`<div class="tabs">${Object.entries(ED).map(([k,e])=>`<button class="tab" data-e="${k}" aria-pressed="${k===S.ed}">${esc(e.label)}</button>`).join('')}</div>
  <h1>Music</h1><p class="lede">Save one song from every year, ${ed().years[0]} to ${ed().years.at(-1)}.</p>
  <div class="stack">${res?`<button class="btn primary" id="go-res">Resume ${nextYear()}</button>`:''}
  <button class="btn ${res?'':'primary'}" id="go-new">New</button>
  <button class="btn" id="go-dm" ${n<2?'disabled':''}>${c.champ?'Deathmatch results':c.dm?'Resume deathmatch':'Deathmatch'}</button>
  <button class="btn" id="go-yr">Skip to year</button>
  <button class="btn" id="go-rank">Rankings</button>
  ${n?'<button class="btn" id="go-picks">Your picks</button>':''}</div>
  ${n<2?'<p class="note">Save at least two songs to unlock Deathmatch.</p>':''}`;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.ed=b.dataset.e;persist();home()});
  $('#go-new').onclick=()=>n?confirmNew():start();
  $('#go-res')&&($('#go-res').onclick=()=>playYear(nextYear()));
  $('#go-dm').onclick=()=>deathmatch();$('#go-yr').onclick=years;$('#go-rank').onclick=()=>rankings();
  $('#go-picks')&&($('#go-picks').onclick=picks)}
const nextYear=()=>ed().years.find(y=>!cur().picks[y])??ed().years[0];
function confirmNew(){leave();chrome(true,false);app.innerHTML=`<div class="panel"><h2>Start over?</h2><p>This clears your ${Object.keys(cur().picks).length} saved songs in ${esc(ed().label)}.</p><div class="stack"><button class="btn primary" id="y">Clear and start</button><button class="btn" id="n">Keep my picks</button></div></div>`;
  $('#y').onclick=()=>{Object.assign(cur(),{picks:{},champ:null,dm:null});persist();syncVotes();start()};$('#n').onclick=home}
function start(){if(S.seenTip)return playYear(ed().years[0]);leave();chrome(true,false);
  app.innerHTML=`<div class="panel"><h2>Did you know?</h2><p>Click to skip a preview. Hold left click to skip silently.</p><p>Once all cards appear, click a cover to play or pause.</p><p>Choose <b>Save</b> to keep that song. Space pauses.</p><button class="btn primary" id="c" autofocus>Continue</button></div>`;
  $('#c').onclick=()=>{S.seenTip=true;persist();playYear(ed().years[0])}}

function playYear(y){leave();view='round';const my=token,songs=ed().data[y];chrome(true,y>ed().years[0]);
  app.innerHTML=`<div class="yr">${y}</div><p class="note" id="hint" hidden></p><section class="bin">${songs.map((s,i)=>cardHTML(s,i,'Save')).join('')}</section>`;
  const els=[...app.querySelectorAll('.card')],infos=[];round={year:y,skip:null,silent:false,my};
  $('#prev').onclick=()=>playYear(ed().years[ed().years.indexOf(y)-1]);
  els.forEach((el,i)=>{bindCover(el,()=>infos[i]);el.querySelector('.save').onclick=e=>{e.stopPropagation();save(y,i)}});
  (async()=>{ // look songs up one at a time so the store API stays happy
    for(let i=0;i<songs.length&&my===token;i++){infos[i]=undefined;const p=itunes(songs[i]);p.then(v=>{infos[i]=v||null;if(my===token)dressCard(els[i],v)});await Promise.race([p,wait(250)])}})();
  (async()=>{for(let i=0;i<els.length&&my===token;i++){
      els[i].hidden=false;if(round.silent)continue;
      let n=0;while(infos[i]===undefined&&n++<15&&my===token&&!round.silent)await wait(100);
      if(my!==token)return;
      const on=!paused&&playCard(els[i],infos[i]);
      await skippable(on?6000:550);
      if(my!==token)return;if(on&&i<els.length-1)stopAudio()}
    if(my!==token)return;round.ready=true;els.forEach(e=>{e.querySelector('.save').disabled=false});
    if(infos.every(v=>!v)){const h=$('#hint');h.hidden=false;h.textContent='Previews and covers could not load here. Use Listen to hear a song.'}
    const picked=cur().picks[y];if(picked!==undefined)els[picked]?.querySelector('.save').focus()})()}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function skippable(ms){return new Promise(r=>{let left=ms,last=Date.now(),done=false;const fin=()=>{if(done)return;done=true;clearInterval(t);if(round)round.skip=null;r()};
  if(round)round.skip=fin;const t=setInterval(()=>{const n=Date.now();if(!paused)left-=n-last;last=n;if(left<=0||!round)fin()},60)})}
function save(y,i){cur().picks[y]=i;persist();syncVotes();const ys=ed().years,idx=ys.indexOf(y),nx=ys[idx+1];stopAudio();
  if(nx===undefined)return picks();if(nx%10===0)return intermission(nx);playYear(nx)}
function intermission(nx){leave();view='break';const my=token;chrome(true,false);let n=5;
  app.innerHTML=`<div class="panel"><h2>Intermission</h2><p>The ${String(nx-10).slice(2)}s are done. Next up, the ${String(nx).slice(2)}s.</p><div class="big" id="n">${n}</div><button class="btn primary" id="c">Continue</button></div>`;
  const go=()=>{if(my===token)playYear(nx)};$('#c').onclick=go;
  (async()=>{while(n>0){await wait(1000);if(my!==token)return;n--;$('#n').textContent=n}go()})()}

/* skip & hold during reveal */
let holdT=null;
document.addEventListener('pointerdown',e=>{if(view!=='round'||!round||round.ready||e.target.closest('.corner,a'))return;
  holdT=setTimeout(()=>{holdT=null;round.silent=true;stopAudio();round.skip?.()},350)});
document.addEventListener('pointerup',e=>{if(!holdT)return;clearTimeout(holdT);holdT=null;if(view==='round'&&round&&!round.ready&&!e.target.closest('.corner,a'))round.skip?.()});
function togglePause(){if(view!=='round'&&view!=='dm')return;paused=!paused;$('#pause').hidden=!paused;if(paused)audio.pause();else if(audio.src&&document.querySelector('.card.on'))audio.play().catch(()=>{})}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('button,a,input,select')){e.preventDefault();togglePause()}});
$('#resume').onclick=togglePause;
$('#home').onclick=home;

function years(){leave();view='years';chrome(true,false);
  app.innerHTML=`<h2 style="margin-top:44px">Skip to year</h2><div class="years">${ed().years.map(y=>`<button data-y="${y}" class="${cur().picks[y]!==undefined?'done':''}">${y}</button>`).join('')}</div><p class="note">Gold years already have a saved song.</p>`;
  app.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{S.seenTip=true;persist();playYear(+b.dataset.y)})}
function picks(){leave();view='picks';chrome(true,false);const c=cur(),by={};
  for(const y of ed().years){if(c.picks[y]===undefined)continue;(by[y-y%10]??=[]).push(y)}
  app.innerHTML=`<h2 style="margin-top:44px">Your picks</h2><p class="note">${Object.keys(c.picks).length} of ${ed().years.length} years saved in ${esc(ed().label)}.</p>
  <div class="stack"><button class="btn primary" id="dm" ${Object.keys(c.picks).length<2?'disabled':''}>Deathmatch</button><button class="btn" id="rk">Rankings</button></div>
  ${Object.entries(by).map(([d,ys])=>`<section class="dec"><h3>${d}s</h3>${ys.map(y=>{const s=ed().data[y][c.picks[y]];return`<div class="row"><b>${y}</b><span>${esc(s.t)} <span class="art">· ${esc(s.a)}</span></span></div>`}).join('')}</section>`).join('')}`;
  $('#dm').onclick=()=>deathmatch();$('#rk').onclick=()=>rankings()}

/* deathmatch: your picks fight in pairs until one is left */
function deathmatch(){leave();const c=cur();if(c.champ!==null&&c.champ!==undefined)return dmDone();
  if(!c.dm){const f=Object.keys(c.picks).map(Number);for(let i=f.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[f[i],f[j]]=[f[j],f[i]]}c.dm={now:f,next:[]};persist()}
  dmRound()}
function dmRound(){leave();view='dm';const my=token,c=cur(),d=c.dm;if(d.now.length<2){d.next.push(...d.now);d.now=d.next;d.next=[];if(d.now.length===1){c.champ=d.now[0];c.dm=null;persist();syncVotes();return dmDone()}shuffle(d.now);persist()}
  const a=d.now[0],b=d.now[1],sa=song(a),sb=song(b),left=d.now.length+d.next.length;chrome(true,false);
  app.innerHTML=`<div class="yr" style="font-size:34px">Deathmatch<small>${left} songs left</small></div><section class="bin two">${cardHTML(sa,0,'Keep')}${cardHTML(sb,1,'Keep')}</section>`;
  const els=[...app.querySelectorAll('.card')],infos=[];
  [sa,sb].forEach((s,i)=>{els[i].hidden=false;els[i].querySelector('.save').disabled=false;bindCover(els[i],()=>infos[i]);itunes(s).then(v=>{infos[i]=v;if(my===token)dressCard(els[i],v)});
    els[i].querySelector('.save').onclick=()=>{const w=i?b:a;d.now.splice(0,2);d.next.push(w);persist();dmRound()}})}
const shuffle=f=>{for(let i=f.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[f[i],f[j]]=[f[j],f[i]]}};
const song=y=>ed().data[y][cur().picks[y]];
function dmDone(){leave();view='dmdone';const c=cur(),s=song(c.champ);chrome(true,false);
  app.innerHTML=`<div class="panel"><h2>Last one standing</h2><p class="yr" style="margin:0">${c.champ}</p><p class="ttl" style="font-size:30px">${esc(s.t)}</p><p class="art" style="font-size:20px">${esc(s.a)}</p>
  <div class="stack"><button class="btn primary" id="again">Run it again</button><button class="btn" id="rk">Deathmatch rankings</button></div></div>`;
  $('#again').onclick=()=>{c.champ=null;c.dm=null;persist();syncVotes();deathmatch()};$('#rk').onclick=()=>rankings('dm')}

/* rankings */
async function rankings(tab='year',y){leave();view='rank';const my=token;chrome(true,false);y=y??(ed().years.findLast(v=>cur().picks[v]!==undefined)||ed().years[0]);
  app.innerHTML=`<h2 style="margin-top:44px">Rankings</h2><p class="note">Loading votes…</p>`;
  const{list,shared}=await allVotes();if(my!==token)return;
  const k=S.ed,rows=[];let total=0;
  if(tab==='year'){const n={};for(const v of list){const p=v?.[k]?.picks?.[y];if(p!==undefined&&ed().data[y][p]){n[p]=(n[p]||0)+1;total++}}
    ed().data[y].forEach((s,i)=>rows.push({s,n:n[i]||0,mine:cur().picks[y]===i,lab:''}))}
  else{const n={};for(const v of list){const e=v?.[k];if(e?.champ==null||!e.picks)continue;const id=e.champ+':'+e.picks[e.champ];n[id]=(n[id]||0)+1;total++}
    for(const[id,c]of Object.entries(n)){const[yy,i]=id.split(':');const s=ed().data[yy]?.[i];if(s)rows.push({s,n:c,mine:cur().champ==yy&&cur().picks[yy]==i,lab:yy})}}
  rows.sort((a,b)=>b.n-a.n);
  app.innerHTML=`<h2 style="margin-top:44px">${shared?'Global rankings':'Local rankings'}</h2>
  ${shared?'':'<p class="note">This view shows your own picks only.</p>'}
  <div class="tabs"><button class="tab" id="t1" aria-pressed="${tab==='year'}">By year</button><button class="tab" id="t2" aria-pressed="${tab==='dm'}">Deathmatch winners</button></div>
  ${tab==='year'?`<label class="note" for="ysel">Year</label><select id="ysel">${ed().years.map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select>`:''}
  <p class="note">${total.toLocaleString()} ${total===1?'vote':'votes'}</p>
  <section class="rank">${rows.length?rows.map(r=>{const p=total?r.n/total*100:0;return`<div class="bar"><div class="t">${r.lab?r.lab+' · ':''}${esc(r.s.t)} <span>${esc(r.s.a)}</span>${r.mine?' <mark>(Your vote)</mark>':''}</div><div class="p">${p.toFixed(1)}%</div><div class="fill"><i style="width:${p}%"></i></div></div>`}).join(''):'<p class="note">No deathmatch winners yet. Finish one to appear here.</p>'}</section>`;
  $('#t1').onclick=()=>rankings('year',y);$('#t2').onclick=()=>rankings('dm',y);$('#ysel')&&($('#ysel').onchange=e=>rankings('year',+e.target.value))}

home();
</script>

<script>
/* unlock audio on the first tap so later previews can play on phones */
(function(){const silent="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";
let done=false;addEventListener('pointerdown',()=>{if(done)return;done=true;try{if(!audio.src){audio.src=silent;audio.play().then(()=>audio.pause()).catch(()=>{})}}catch{}},{capture:true});})();
</script>
</body>
