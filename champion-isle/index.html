<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champion Isle 8-Bit</title>
<style>
  :root {
    --bg: #0d0b1a;
    --frame: #f0a020;
    --frame-dark: #8a4a10;
    --glow: rgba(240, 160, 32, 0.35);
    --text: #f4ecd8;
    --muted: #9a8fb0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 40%, #1d1838 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    overflow: hidden;
  }
  #gameContainer {
    border: 4px solid var(--frame);
    box-shadow: 0 0 0 4px var(--frame-dark), 0 0 30px var(--glow);
    background: #000;
    line-height: 0;
  }
  #gameCanvas {
    display: block;
    width: min(94vw, calc((100vh - 70px) * 800 / 480));
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .hint { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-align: center; padding: 0 12px; }
  .hint b { color: var(--frame); }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="480"></canvas>
</div>
<div class="hint">
  <b>WASD / Arrows</b> move &nbsp;·&nbsp; <b>E</b> talk / advance &nbsp;·&nbsp; <b>Space</b> start
  &nbsp;·&nbsp; <b>Esc</b> leave &nbsp;·&nbsp; <b>M</b> sound on/off
</div>

<script>
'use strict';

/* =========================================================
   CORE SETUP
   ========================================================= */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;   // 800 x 480
const TILE = 32, COLS = 25, ROWS = 15;
ctx.imageSmoothingEnabled = false;

const STATES = Object.freeze({
  MENU: 'MENU', OVERWORLD: 'OVERWORLD', MINIGAME: 'MINIGAME',
  DIALOGUE: 'DIALOGUE', GAME_OVER: 'GAME_OVER'
});

const game = {
  state: STATES.MENU, tick: 0, stateTick: 0,
  scrolls: 0, wins: 0, losses: 0,
  beatChampion: false, talkedToCoach: false,
  doorArmed: true, shake: 0, muted: false, result: null
};
function setState(s) { game.state = s; game.stateTick = 0; }

/* =========================================================
   UTILITIES
   ========================================================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function hash(x, y, s = 0) {
  let h = Math.imul(x + s * 31, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function px(x, y, w, h, c, g = ctx) {
  g.fillStyle = c;
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
// Blocky stepped circle for an 8-bit look
function pixelCircle(cx, cy, r, c, g = ctx, step = 2) {
  g.fillStyle = c;
  for (let dy = -r; dy < r; dy += step) {
    const yy = dy + step / 2;
    const hw = Math.round(Math.sqrt(Math.max(0, r * r - yy * yy)) / step) * step;
    g.fillRect(Math.round(cx - hw), Math.round(cy + dy), hw * 2, step);
  }
}
function text(str, x, y, { size = 16, color = '#fff', align = 'left', shadow = '#000', bold = true } = {}) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, x + 2, y + 2); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function panel(x, y, w, h, border = '#f0a020', fill = '#120e26') {
  px(x, y, w, h, border);
  px(x + 3, y + 3, w - 6, h - 6, '#000');
  px(x + 5, y + 5, w - 10, h - 10, fill);
}
function wrap(str, maxW) {
  const words = str.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* =========================================================
   INPUT
   ========================================================= */
const held = new Set(), pressed = new Set();
const BLOCK = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  initAudio();
  if (!e.repeat) pressed.add(e.code);
  held.add(e.code);
});
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => held.clear());
const isDown = (...c) => c.some(k => held.has(k));
const hit = (...c) => c.some(k => pressed.has(k));
const UP = ['ArrowUp', 'KeyW'], DOWN = ['ArrowDown', 'KeyS'];
const LEFT = ['ArrowLeft', 'KeyA'], RIGHT = ['ArrowRight', 'KeyD'];

/* =========================================================
   AUDIO (native Web Audio chiptune blips)
   ========================================================= */
let actx = null;
function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur = 0.08, type = 'square', vol = 0.06, slide = 0, delay = 0) {
  if (!actx || game.muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  blip: (f = 880) => tone(f, 0.03, 'square', 0.03),
  select: () => { tone(523, 0.08); tone(784, 0.12, 'square', 0.06, 0, 0.08); },
  move: () => tone(440, 0.04, 'square', 0.04),
  hit: () => tone(620, 0.05, 'square', 0.07, 120),
  hitAI: () => tone(440, 0.05, 'square', 0.07, 80),
  wall: () => tone(300, 0.03, 'triangle', 0.07),
  score: () => { tone(784, 0.08); tone(988, 0.08, 'square', 0.06, 0, 0.08); tone(1319, 0.16, 'square', 0.06, 0, 0.16); },
  miss: () => { tone(330, 0.1, 'square', 0.06, -80); tone(220, 0.18, 'square', 0.06, -60, 0.1); },
  count: () => tone(660, 0.08, 'square', 0.05),
  go: () => tone(1046, 0.18, 'square', 0.06),
  win: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.12, 'square', 0.06, 0, i * 0.11)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.16, 'square', 0.06, 0, i * 0.15))
};

/* =========================================================
   PARTICLES + SCREEN SHAKE
   ========================================================= */
let particles = [];
function burst(x, y, color, n = 12, spd = 3, grav = 0) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd + 0.5;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: grav,
      life: 1, decay: 0.015 + Math.random() * 0.03,
      size: (Math.random() * 3 + 2) | 0, color
    });
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g;
    p.vx *= 0.96; if (!p.g) p.vy *= 0.96;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    px(p.x, p.y, p.size, p.size, p.color);
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   SPRITES (built from pixel strings at runtime)
   ========================================================= */
function makeSprite(rows, pal, flip = false) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][flip ? w - 1 - x : x];
    if (ch === '.' || !pal[ch]) continue;
    g.fillStyle = pal[ch];
    g.fillRect(x, y, 1, 1);
  }
  return c;
}
function drawSprite(spr, x, y, scale = 3) {
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, Math.round(x), Math.round(y), spr.width * scale, spr.height * scale);
}

// Calico cat
const CAT_PAL = { k: '#1b1420', w: '#f6efe0', o: '#e8822e', b: '#2b2530', p: '#f39ab4' };
const CAT_A = [
  '.k........k.',
  'kok......kbk',
  'kookkkkkkbbk',
  'koowwwwwwbbk',
  'kwwkwwwwkwwk',
  'kwwkwwwwkwwk',
  'kwwwwppwwwwk',
  '.kwwwwwwwwk.',
  '.kwoowwbbwk.',
  '.kwoowwbbwk.',
  '.kwwwkkwwwk.',
  '.kkk....kkk.'
];
const CAT_B = CAT_A.slice(0, 10).concat(['.kwwk..kwwk.', '..kk....kk..']);
const toBack = rows => rows.map((r, i) => (i >= 4 && i <= 6) ? 'kwwwwwwwwwwk' : r);
const CAT = {
  down:  [makeSprite(CAT_A, CAT_PAL), makeSprite(CAT_B, CAT_PAL)],
  right: [makeSprite(CAT_A, CAT_PAL), makeSprite(CAT_B, CAT_PAL)],
  left:  [makeSprite(CAT_A, CAT_PAL, true), makeSprite(CAT_B, CAT_PAL, true)],
  up:    [makeSprite(toBack(CAT_A), CAT_PAL), makeSprite(toBack(CAT_B), CAT_PAL)]
};

// Tanuki champion in a white gi with a red headband
const TAN_PAL = { k: '#1b1420', b: '#4a3428', r: '#e0403a', t: '#b07a4a', w: '#ffffff', c: '#f1dcb4', g: '#f2f2f2' };
const TAN_ROWS = [
  '.kk......kk.',
  'kbbk....kbbk',
  'kbrrrrrrrrbk',
  'kttttttttttk',
  'kbbbttttbbbk',
  'kbwbttttbwbk',
  'kttttkkttttk',
  '.kttccccttk.',
  '.kggggggggk.',
  '.kgggrrgggk.',
  '.kggggggggk.',
  '.kkk....kkk.'
];
const TANUKI = makeSprite(TAN_ROWS, TAN_PAL);
const TANUKI_FLIP = makeSprite(TAN_ROWS, TAN_PAL, true);

/* =========================================================
   OVERWORLD MAP
   ~ water   s sand   g grass   p path   f flowers
   T tree    r rock   A arena   D arena door   P torii pillar
   ========================================================= */
const MAP = [
  '~~~~~~~~~~~~~~~~~~~~~~~~~',
  '~~sssssssssssssssssssss~~',
  '~ssTggggggAAAAAAAggggTss~',
  '~sgggfgggrAAAAAAAgggfggs~',
  '~sggggggggAAADAAAggggggs~',
  '~sgggggggggggpgggggggggs~',
  '~sgTggggggggPpPggggggggs~',
  '~sgpppppppppppppppppppgs~',
  '~sgpgggggggggpggggggrpgs~',
  '~sgpggTggggggpgggggggpgs~',
  '~sgpgggfgggggpggggTggpgs~',
  '~sgpppppppppppppppppppgs~',
  '~ssgggrggggggpggggggggss~',
  '~~sssssssssssssssssssss~~',
  '~~~~~~~~~~~~~~~~~~~~~~~~~'
];
const SOLID = new Set(['~', 'T', 'r', 'A', 'P']);
const WATER_TILES = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (MAP[r][c] === '~') WATER_TILES.push([c, r]);

const player = { x: 13 * TILE + 6, y: 12 * TILE + 14, w: 20, h: 12, dir: 'up', moving: false, anim: 0 };
const npc = { x: 16 * TILE + 6, y: 5 * TILE + 14, w: 20, h: 12, flip: false };
const doorRect = { x: 13 * TILE + 4, y: 4 * TILE + 16, w: 24, h: 16 };

function solidAt(x, y) {
  const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return true;
  return SOLID.has(MAP[r][c]);
}
function blocked(x, y, w, h) {
  return solidAt(x, y) || solidAt(x + w - 1, y) || solidAt(x, y + h - 1) || solidAt(x + w - 1, y + h - 1)
    || overlap({ x, y, w, h }, npc);
}

/* ---------- static island layer (pre-rendered once) ---------- */
function drawGrass(g, x, y, c, r) {
  px(x, y, TILE, TILE, '#5cae4a', g);
  for (let i = 0; i < 5; i++) {
    const tx = Math.floor(hash(c, r, i) * 28), ty = Math.floor(hash(c, r, i + 9) * 26);
    px(x + tx, y + ty, 2, 4, '#4a963c', g);
    px(x + tx + 2, y + ty + 2, 2, 2, '#72c45a', g);
  }
}
function drawSand(g, x, y, c, r) {
  px(x, y, TILE, TILE, '#e8d08a', g);
  for (let i = 0; i < 6; i++) px(x + Math.floor(hash(c, r, i) * 30), y + Math.floor(hash(c, r, i + 5) * 30), 2, 2, '#d6b96c', g);
}
function drawPath(g, x, y, c, r) {
  px(x, y, TILE, TILE, '#c9a46a', g);
  for (let i = 0; i < 4; i++) px(x + Math.floor(hash(c, r, i) * 28), y + Math.floor(hash(c, r, i + 3) * 28), 4, 2, '#ad8850', g);
}
function drawWater(g, x, y, c, r) {
  px(x, y, TILE, TILE, '#2b6fd6', g);
  for (let i = 0; i < 3; i++) px(x + Math.floor(hash(c, r, i) * 26), y + Math.floor(hash(c, r, i + 4) * 30), 6, 2, '#2460bd', g);
  const land = (cc, rr) => cc >= 0 && rr >= 0 && cc < COLS && rr < ROWS && MAP[rr][cc] !== '~';
  if (land(c, r - 1)) px(x, y, TILE, 3, '#bfe6ff', g);
  if (land(c, r + 1)) px(x, y + TILE - 3, TILE, 3, '#bfe6ff', g);
  if (land(c - 1, r)) px(x, y, 3, TILE, '#bfe6ff', g);
  if (land(c + 1, r)) px(x + TILE - 3, y, 3, TILE, '#bfe6ff', g);
}
function drawTree(g, x, y) {
  px(x + 4, y + 25, 24, 5, 'rgba(0,0,0,0.22)', g);
  px(x + 13, y + 18, 6, 11, '#6b4426', g);
  px(x + 6, y + 2, 20, 4, '#2c6b30', g);
  px(x + 2, y + 6, 28, 12, '#2c6b30', g);
  px(x + 6, y + 18, 20, 3, '#2c6b30', g);
  px(x + 6, y + 5, 18, 10, '#3f8f3f', g);
  px(x + 8, y + 6, 8, 4, '#5fb35a', g);
}
function drawRock(g, x, y) {
  px(x + 6, y + 12, 20, 14, '#7d7f8c', g);
  px(x + 9, y + 9, 14, 4, '#7d7f8c', g);
  px(x + 9, y + 11, 8, 4, '#a3a6b4', g);
  px(x + 6, y + 24, 20, 3, '#55566a', g);
}
function drawFlowers(g, x, y, c, r) {
  const cols = ['#ff6b8b', '#ffd84a', '#ffffff'];
  for (let i = 0; i < 4; i++) {
    const fx = x + 3 + Math.floor(hash(c, r, i) * 24), fy = y + 3 + Math.floor(hash(c, r, i + 7) * 24);
    px(fx, fy, 4, 4, cols[i % 3], g);
    px(fx + 1, fy + 1, 2, 2, '#f0a020', g);
  }
}
function drawArena(g) {
  const x0 = 10 * TILE, y0 = 2 * TILE, w = 7 * TILE;
  px(x0 + 4, y0 + 88, w - 8, 8, 'rgba(0,0,0,0.25)', g);
  px(x0 + 8, y0 + 34, w - 16, 58, '#efe6d2', g);
  px(x0 + 8, y0 + 84, w - 16, 8, '#c9bfa8', g);
  for (const cx of [x0 + 10, x0 + 60, x0 + w - 68, x0 + w - 18]) px(cx, y0 + 34, 8, 58, '#9c2a22', g);
  // tiered roof
  px(x0 - 4, y0 + 20, w + 8, 16, '#8e2a20', g); px(x0 - 4, y0 + 20, w + 8, 12, '#c8402f', g);
  px(x0 + 20, y0 + 6, w - 40, 16, '#8e2a20', g); px(x0 + 20, y0 + 6, w - 40, 12, '#c8402f', g);
  px(x0 + 44, y0 - 2, w - 88, 8, '#2a1a14', g);
  for (let i = x0; i < x0 + w; i += 8) px(i, y0 + 27, 4, 2, '#a8352a', g);
  for (let i = x0 + 24; i < x0 + w - 24; i += 8) px(i, y0 + 13, 4, 2, '#a8352a', g);
  // door
  const dx = 13 * TILE + 4, dy = y0 + 56;
  px(dx - 4, dy - 4, 32, 40, '#5a3a22', g);
  px(dx, dy, 24, 36, '#1d1210', g);
  px(dx, dy + 30, 24, 6, '#3a2a20', g);
  // sign with paddle icon
  px(dx - 12, y0 + 38, 48, 14, '#7a4a24', g);
  pixelCircle(dx + 6, y0 + 45, 5, '#e0403a', g);
  px(dx + 10, y0 + 47, 6, 3, '#c48a4a', g);
  px(dx + 22, y0 + 42, 4, 4, '#ffffff', g);
  // banners
  for (const fx of [x0 - 2, x0 + w - 2]) {
    px(fx, y0 - 14, 3, 36, '#3a2a20', g);
    px(fx + 3, y0 - 14, 12, 8, '#f0a020', g);
  }
}
function buildIsland() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    const t = MAP[r][col], x = col * TILE, y = r * TILE;
    if (t === '~') drawWater(g, x, y, col, r);
    else if (t === 's') drawSand(g, x, y, col, r);
    else if (t === 'p' || t === 'D') drawPath(g, x, y, col, r);
    else {
      drawGrass(g, x, y, col, r);
      if (t === 'f') drawFlowers(g, x, y, col, r);
      if (t === 'T') drawTree(g, x, y);
      if (t === 'r') drawRock(g, x, y);
    }
  }
  drawArena(g);
  return c;
}
const ISLAND = buildIsland();

/* =========================================================
   DIALOGUE SYSTEM
   ========================================================= */
const dlg = { speaker: '', portrait: null, lines: [], i: 0, shown: 0, onDone: null, canLeave: false };
function openDialogue(speaker, portrait, lines, onDone = null, canLeave = false) {
  Object.assign(dlg, { speaker, portrait, lines, i: 0, shown: 0, onDone, canLeave });
  setState(STATES.DIALOGUE);
}
function updateDialogue() {
  const line = dlg.lines[dlg.i];
  if (dlg.shown < line.length) {
    const before = Math.floor(dlg.shown);
    dlg.shown = Math.min(line.length, dlg.shown + 0.8);
    const now = Math.floor(dlg.shown);
    if (now !== before && now % 2 === 0 && line[now - 1] !== ' ') SFX.blip(dlg.portrait ? 520 : 880);
  }
  if (hit('Escape')) {
    setState(STATES.OVERWORLD);
    if (dlg.canLeave) { player.y = 5 * TILE + 10; player.dir = 'down'; }
    return;
  }
  if (hit('KeyE', 'Enter')) {
    if (dlg.shown < line.length) { dlg.shown = line.length; return; }
    dlg.i++; dlg.shown = 0;
    SFX.blip(660);
    if (dlg.i >= dlg.lines.length) {
      setState(STATES.OVERWORLD);
      if (dlg.onDone) dlg.onDone();
    }
  }
}
function drawDialogue() {
  const bx = 24, by = H - 132, bw = W - 48, bh = 112;
  panel(bx, by, bw, bh);
  let tx = bx + 22;
  if (dlg.portrait) {
    panel(bx + 12, by + 12, 88, 88, '#3a3370', '#2a2550');
    drawSprite(dlg.portrait, bx + 20, by + 20 + Math.round(Math.sin(game.tick / 10)), 6);
    tx = bx + 116;
  }
  // name tag
  ctx.font = 'bold 14px "Courier New", monospace';
  const nw = ctx.measureText(dlg.speaker).width + 28;
  panel(bx + 12, by - 24, nw, 30, '#f0a020', '#e0403a');
  text(dlg.speaker, bx + 26, by - 4, { size: 14, color: '#fff' });

  ctx.font = 'bold 17px "Courier New", monospace';
  const lines = wrap(dlg.lines[dlg.i], bx + bw - tx - 24);
  let left = Math.floor(dlg.shown);
  lines.forEach((ln, li) => {
    if (left <= 0) return;
    text(ln.slice(0, left), tx, by + 36 + li * 22, { size: 17, color: '#f4ecd8' });
    left -= ln.length + 1;
  });
  if (dlg.shown >= dlg.lines[dlg.i].length && Math.floor(game.tick / 20) % 2 === 0) {
    text('▼ E', bx + bw - 54, by + bh - 14, { size: 14, color: '#ffd84a' });
  }
  if (dlg.canLeave) text('ESC: leave', bx + bw - 170, by + bh - 14, { size: 12, color: '#9a8fb0' });
}

/* =========================================================
   MENU STATE
   ========================================================= */
const EVENTS = [
  { name: 'TABLE TENNIS', open: true, icon: iconPingPong },
  { name: 'ARCHERY', icon: iconArchery },
  { name: 'SKATEBOARD', icon: iconSkate },
  { name: 'RUGBY', icon: iconRugby },
  { name: 'CLIMBING', icon: iconClimb },
  { name: 'SWIMMING', icon: iconSwim },

function nearNpc() {
  return Math.hypot(player.x + 10 - (npc.x + 10), player.y + 6 - (npc.y + 6)) < 52;
}
function updateOverworld() {
  let dx = (isDown(...RIGHT) ? 1 : 0) - (isDown(...LEFT) ? 1 : 0);
  let dy = (isDown(...DOWN) ? 1 : 0) - (isDown(...UP) ? 1 : 0);
  player.moving = !!(dx || dy);
  if (dy < 0) player.dir = 'up'; else if (dy > 0) player.dir = 'down';
  if (dx < 0) player.dir = 'left'; else if (dx > 0) player.dir = 'right';
  if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
  const sp = 2.4;
  if (!blocked(player.x + dx * sp, player.y, player.w, player.h)) player.x += dx * sp;
  if (!blocked(player.x, player.y + dy * sp, player.w, player.h)) player.y += dy * sp;
  if (player.moving) {
    player.anim++;
    if (player.anim % 14 === 0) burst(player.x + 10, player.y + 12, '#d6c49a', 2, 0.6);
  } else player.anim = 0;

  npc.flip = player.x > npc.x;

  if (nearNpc() && hit('KeyE')) {
    game.talkedToCoach = true;
    openDialogue('COACH TANUKI', TANUKI, coachLines());
    return;
  }

  const onDoor = overlap(player, doorRect);
  if (onDoor && game.doorArmed) {
    game.doorArmed = false;
    openDialogue('ARENA SIGN', null, game.beatChampion
      ? ['TABLE TENNIS ARENA - Rematch the champion?', 'Press E to step onto the court!']
      : ['TABLE TENNIS ARENA', 'First to 3 points wins. Move your paddle with W/S or the Arrow keys.', 'Press E to step onto the court!'],
      startMatch, true);
    return;
  }
  if (!onDoor) game.doorArmed = true;
}

/* =========================================================
   MINIGAME STATE: TABLE TENNIS
   ========================================================= */
const TBL = { x: 120, y: 70, w: 560, h: 360 };
const PW = 10, PH = 64;
const PX = TBL.x - 16, AX = TBL.x + TBL.w + 6;
const WIN_SCORE = 3;
const mg = {
  py: 0, pvy: 0, ay: 0, avy: 0,
  ball: { x: 0, y: 0, vx: 0, vy: 0, r: 5, speed: 4.2, visible: true },
  trail: [], ps: 0, as: 0, phase: 'countdown', timer: 0, rally: 0,
  serveDir: 1, aiTarget: 0, aiTimer: 0, aiOffset: 0,
  banner: '', bannerT: 0, pFlash: 0, aFlash: 0, pHop: 0, aHop: 0
};
const CROWD = [];
for (let i = 0; i < 46; i++) CROWD.push({ x: 8 + i * 17.4, y: 22 + (i % 2) * 14, c: ['#e0403a', '#30a0f0', '#ffd84a', '#5cdc6a', '#f39ab4', '#f6efe0'][i % 6], p: rand(0, 6.28) });
for (let i = 0; i < 46; i++) CROWD.push({ x: 8 + i * 17.4, y: 452 + (i % 2) * 12, c: ['#f6efe0', '#5cdc6a', '#30a0f0', '#e0403a', '#ffd84a'][i % 5], p: rand(0, 6.28) });

function centerBall() {
  const b = mg.ball;
  b.x = W / 2; b.y = TBL.y + TBL.h / 2; b.vx = 0; b.vy = 0; b.visible = true;
  mg.trail = [];
}
function startMatch() {
  mg.ps = 0; mg.as = 0; mg.rally = 0;
  mg.py = mg.ay = TBL.y + TBL.h / 2 - PH / 2;
  mg.serveDir = Math.random() < 0.5 ? -1 : 1;
  mg.phase = 'countdown'; mg.timer = 180;
  mg.banner = ''; mg.bannerT = 0;
  particles = [];
  centerBall();
  setState(STATES.MINIGAME);
}
function serve() {
  const b = mg.ball, ang = rand(-0.5, 0.5);
  b.speed = 4.2;
  b.vx = Math.cos(ang) * b.speed * mg.serveDir;
  b.vy = Math.sin(ang) * b.speed;
  mg.rally = 0;
  mg.aiOffset = rand(-14, 14);
  mg.phase = 'play';
}
function predictY() {
  const b = mg.ball;
  if (b.vx <= 0) return TBL.y + TBL.h / 2;
  const t = (AX - b.r - b.x) / b.vx;
  const top = TBL.y + b.r, span = TBL.h - 2 * b.r;
  let rel = b.y + b.vy * t - top;
  rel = ((rel % (2 * span)) + 2 * span) % (2 * span);
  if (rel > span) rel = 2 * span - rel;
  return top + rel;
}
function paddleHit(dir, py, pvy) {
  const b = mg.ball;
  const rel = clamp((b.y - (py + PH / 2)) / (PH / 2), -1, 1);
  b.speed = Math.min(b.speed + 0.45, 12);
  const ang = rel * 1.0;
  b.vx = Math.cos(ang) * b.speed * dir;
  b.vy = Math.sin(ang) * b.speed + pvy * 0.2;
  mg.rally++;
  game.shake = Math.max(game.shake, 4);
  if (dir === 1) {
    burst(b.x, b.y, '#30a0f0', 12, 3.5); SFX.hit(); mg.pFlash = 8; mg.pHop = 8;
    // Decide how well the AI will read this shot (occasional misread = winnable)
    const missChance = 0.12 + Math.min(mg.rally, 20) * 0.012;
    mg.aiOffset = Math.random() < missChance
      ? (Math.random() < 0.5 ? -1 : 1) * (PH * 0.65 + rand(0, 22))
      : rand(-16, 16);
  } else {
    burst(b.x, b.y, '#e0403a', 12, 3.5); SFX.hitAI(); mg.aFlash = 8; mg.aHop = 8;
  }
}
function pointTo(who) {
  mg.ball.visible = false;
  game.shake = 10;
  if (who === 'player') {
    mg.ps++; mg.serveDir = 1;
    burst(W - 60, mg.ball.y, '#30a0f0', 30, 5); burst(W - 60, mg.ball.y, '#ffd84a', 16, 4);
    mg.banner = 'POINT!'; SFX.score();
  } else {
    mg.as++; mg.serveDir = -1;
    burst(60, mg.ball.y, '#e0403a', 30, 5);
    mg.banner = 'MISS!'; SFX.miss();
  }
  mg.bannerT = 70;
  if (mg.ps >= WIN_SCORE || mg.as >= WIN_SCORE) {
    mg.phase = 'end'; mg.timer = 100;
    mg.banner = mg.ps >= WIN_SCORE ? 'MATCH!' : 'GAME!';
  } else {
    mg.phase = 'point'; mg.timer = 75;
  }
}
function finishMatch() {
  const won = mg.ps >= WIN_SCORE;
  game.result = { won, ps: mg.ps, as: mg.as, first: false };
  if (won) {
    game.wins++;
    if (!game.beatChampion) { game.beatChampion = true; game.scrolls++; game.result.first = true; }
    SFX.win();
  } else { game.losses++; SFX.lose(); }
  particles = [];
  setState(STATES.GAME_OVER);
}
function stepBall() {
  const b = mg.ball;
  const steps = Math.ceil(Math.max(Math.abs(b.vx), Math.abs(b.vy)) / 3);
  for (let s = 0; s < steps; s++) {
    b.x += b.vx / steps; b.y += b.vy / steps;
    if (b.y - b.r < TBL.y) { b.y = TBL.y + b.r; b.vy = Math.abs(b.vy); burst(b.x, b.y, '#ffffff', 4, 2); SFX.wall(); }
    else if (b.y + b.r > TBL.y + TBL.h) { b.y = TBL.y + TBL.h - b.r; b.vy = -Math.abs(b.vy); burst(b.x, b.y, '#ffffff', 4, 2); SFX.wall(); }
    if (b.vx < 0 && b.x - b.r <= PX + PW && b.x + b.r >= PX && b.y + b.r >= mg.py && b.y - b.r <= mg.py + PH) {
      b.x = PX + PW + b.r; paddleHit(1, mg.py, mg.pvy);
    }
    if (b.vx > 0 && b.x + b.r >= AX && b.x - b.r <= AX + PW && b.y + b.r >= mg.ay && b.y - b.r <= mg.ay + PH) {
      b.x = AX - b.r; paddleHit(-1, mg.ay, mg.avy);
    }
    if (b.x < 40) { pointTo('ai'); return; }
    if (b.x > W - 40) { pointTo('player'); return; }
  }
  mg.trail.push({ x: b.x, y: b.y });
  if (mg.trail.length > 8) mg.trail.shift();
}
function updateMinigame() {
  if (hit('Escape')) { returnToIsland(); return; }

  // Player paddle
  const pv = (isDown(...DOWN) ? 1 : 0) - (isDown(...UP) ? 1 : 0);
  mg.pvy = pv * 6;
  mg.py = clamp(mg.py + mg.pvy, TBL.y - 10, TBL.y + TBL.h - PH + 10);

  // AI paddle: predicts the ball, but with reaction delay, speed cap and occasional misreads
  if (--mg.aiTimer <= 0) {
    mg.aiTimer = 6;
    mg.aiTarget = (mg.phase === 'play' && mg.ball.vx > 0) ? predictY() + mg.aiOffset : TBL.y + TBL.h / 2;
  }
  const maxS = clamp(4.0 + 0.3 * (mg.ps - mg.as) + Math.min(mg.rally, 20) * 0.03, 3.2, 5.6);
  mg.avy = clamp((mg.aiTarget - (mg.ay + PH / 2)) * 0.18, -maxS, maxS);
  mg.ay = clamp(mg.ay + mg.avy, TBL.y - 10, TBL.y + TBL.h - PH + 10);

  if (mg.phase === 'countdown') {
    if (mg.timer % 60 === 0 && mg.timer > 0) SFX.count();
    if (--mg.timer <= 0) { serve(); SFX.go(); mg.banner = 'GO!'; mg.bannerT = 40; }
  } else if (mg.phase === 'serve') {
    if (--mg.timer <= 0) { serve(); SFX.go(); }
  } else if (mg.phase === 'play') {
    stepBall();
  } else if (mg.phase === 'point') {
    if (--mg.timer <= 0) { centerBall(); mg.phase = 'serve'; mg.timer = 45; mg.banner = 'READY...'; mg.bannerT = 45; }
  } else if (mg.phase === 'end') {
    if (--mg.timer <= 0) finishMatch();
  }

  if (mg.bannerT > 0) mg.bannerT--;
  mg.pFlash = Math.max(0, mg.pFlash - 1); mg.aFlash = Math.max(0, mg.aFlash - 1);
  mg.pHop *= 0.8; mg.aHop *= 0.8;
}
function drawPaddle(x, y, color, edge, flash) {
  px(x + 3, y + 4, PW, PH, 'rgba(0,0,0,0.35)');
  px(x, y, PW, PH, flash ? '#ffffff' : edge);
  px(x + 2, y + 2, PW - 4, PH - 4, flash ? '#ffffff' : color);
  px(x + 3, y + 4, 2, PH - 8, 'rgba(255,255,255,0.35)');
}
function drawMinigame() {
  px(0, 0, W, H, '#2a1f3d');
  px(0, 0, W, 56, '#1c1530'); px(0, 444, W, 36, '#1c1530');
  for (const c of CROWD) {
    const bob = Math.round(Math.abs(Math.sin(game.tick / (mg.bannerT ? 4 : 18) + c.p)) * (mg.bannerT ? 5 : 2));
    px(c.x, c.y - bob, 10, 10, c.c);
    px(c.x + 2, c.y + 2 - bob, 2, 2, '#1b1420'); px(c.x + 6, c.y + 2 - bob, 2, 2, '#1b1420');
  }
  // table
  px(TBL.x + 10, TBL.y + 12, TBL.w, TBL.h, 'rgba(0,0,0,0.35)');
  px(TBL.x - 4, TBL.y - 4, TBL.w + 8, TBL.h + 8, '#f4f4f4');
  px(TBL.x, TBL.y, TBL.w, TBL.h, '#1f6f8b');
  for (let x = TBL.x; x < TBL.x + TBL.w; x += 20) px(x, TBL.y + TBL.h / 2 - 1, 10, 2, 'rgba(255,255,255,0.35)');
  // net
  px(W / 2 - 3, TBL.y - 14, 6, TBL.h + 28, '#d8d8d8');
  for (let y = TBL.y - 12; y < TBL.y + TBL.h + 12; y += 6) px(W / 2 - 2, y, 4, 3, '#555');
  px(W / 2 - 5, TBL.y - 18, 10, 6, '#333'); px(W / 2 - 5, TBL.y + TBL.h + 12, 10, 6, '#333');

  // characters behind their paddles
  drawSprite(CAT.right[0], PX - 46, mg.py + PH / 2 - 18 - mg.pHop, 3);
  drawSprite(TANUKI, AX + PW + 8, mg.ay + PH / 2 - 18 - mg.aHop, 3);
  drawPaddle(PX, mg.py, '#30a0f0', '#1d5f99', mg.pFlash > 4);
  drawPaddle(AX, mg.ay, '#e04848', '#8e2a20', mg.aFlash > 4);

  // ball, trail, shadow
  const b = mg.ball;
  if (b.visible) {
    mg.trail.forEach((t, i) => { ctx.globalAlpha = (i + 1) / mg.trail.length * 0.4; px(t.x - 3, t.y - 3, 6, 6, '#ffd84a'); });
    ctx.globalAlpha = 0.3; px(b.x - 4, b.y + 5, 10, 4, '#000'); ctx.globalAlpha = 1;
    pixelCircle(b.x, b.y, b.r + 1, '#ffffff');
  }
  drawParticles();

  // scoreboard
  panel(290, 4, 220, 50, '#f0a020', '#120e26');
  text('YOU', 330, 24, { size: 12, color: '#30a0f0', align: 'center' });
  text('CHAMP', 470, 24, { size: 12, color: '#e04848', align: 'center' });
  text(`${mg.ps}`, 370, 42, { size: 28, color: '#30a0f0', align: 'center' });
  text('-', 400, 40, { size: 22, color: '#f4ecd8', align: 'center' });
  text(`${mg.as}`, 430, 42, { size: 28, color: '#e04848', align: 'center' });
  for (let i = 0; i < WIN_SCORE; i++) {
    px(312 + i * 12, 30, 8, 8, i < mg.ps ? '#30a0f0' : '#3a3370');
    px(452 + i * 12, 30, 8, 8, i < mg.as ? '#e04848' : '#3a3370');
  }
  if (mg.rally >= 3 && mg.phase === 'play') text(`RALLY x${mg.rally}`, W / 2, 470, { size: 14, color: '#ffd84a', align: 'center' });
  text('ESC: forfeit', W - 12, 472, { size: 11, color: '#9a8fb0', align: 'right', bold: false });

  // big messages
  if (mg.phase === 'countdown') {
    const n = Math.ceil(mg.timer / 60);
    const s = 60 + (mg.timer % 60) * 0.6;
    text(String(n), W / 2, H / 2 + s / 3, { size: Math.round(s), color: '#ffd84a', align: 'center', shadow: '#7a2a10' });
    text('FIRST TO 3 WINS', W / 2, H / 2 + 70, { size: 16, color: '#f4ecd8', align: 'center' });
  }
  if (mg.bannerT > 0 && mg.banner) {
    const col = mg.banner === 'MISS!' || mg.banner === 'GAME!' ? '#e04848' : '#ffd84a';
    text(mg.banner, W / 2, H / 2 + 14, { size: 44, color: col, align: 'center', shadow: '#000' });
  }
}

/* =========================================================
   GAME OVER STATE
   ========================================================= */
function returnToIsland() {
  player.x = 13 * TILE + 6; player.y = 5 * TILE + 10; player.dir = 'down';
  game.doorArmed = false;
  particles = [];
  setState(STATES.OVERWORLD);
}
function updateGameOver() {
  const r = game.result;
  if (r && r.won && game.stateTick % 8 === 0) {
    const cols = ['#ffd84a', '#30a0f0', '#e0403a', '#5cdc6a', '#f39ab4'];
    burst(rand(40, W - 40), rand(-10, 60), cols[Math.floor(rand(0, cols.length))], 6, 2, 0.08);
  }
  if (game.stateTick > 30) {
    if (hit('Space', 'Enter')) { SFX.select(); returnToIsland(); }
    else if (hit('KeyR')) { SFX.select(); startMatch(); }
  }
}
function drawScroll(cx, cy) {
  px(cx - 40, cy - 24, 80, 48, '#f1dcb4');
  px(cx - 40, cy - 24, 80, 4, '#d6b96c');
  for (let i = 0; i < 4; i++) px(cx - 28, cy - 12 + i * 8, 56 - (i % 2) * 14, 3, '#a0582a');
  px(cx - 48, cy - 30, 10, 60, '#e0403a'); px(cx + 38, cy - 30, 10, 60, '#e0403a');
  px(cx - 46, cy - 34, 6, 4, '#ffd84a'); px(cx + 40, cy - 34, 6, 4, '#ffd84a');
  px(cx - 46, cy + 30, 6, 4, '#ffd84a'); px(cx + 40, cy + 30, 6, 4, '#ffd84a');
}
function drawGameOver() {
  const r = game.result || { won: false, ps: 0, as: 0 };
  px(0, 0, W, H, r.won ? '#1a1436' : '#120c18');
  for (let y = 0; y < H; y += 4) { ctx.globalAlpha = 0.08; px(0, y, W, 2, '#000'); }
  ctx.globalAlpha = 1;

  if (r.won) {
    text('VICTORY!', W / 2, 92, { size: 56, color: '#ffd84a', align: 'center', shadow: '#7a2a10' });
    text(`You beat Coach Tanuki ${r.ps} - ${r.as}`, W / 2, 132, { size: 18, color: '#f4ecd8', align: 'center' });
    const bob = Math.round(Math.sin(game.tick / 15) * 4);
    drawScroll(W / 2, 224 + bob);
    drawSprite(CAT.down[Math.floor(game.tick / 12) % 2], W / 2 - 160, 196, 5);
    text(r.first ? 'TABLE TENNIS SCROLL OBTAINED!' : 'CHAMPION DEFEATED AGAIN!', W / 2, 312, { size: 20, color: '#5cdc6a', align: 'center' });
  } else {
    text('DEFEAT', W / 2, 92, { size: 56, color: '#e04848', align: 'center', shadow: '#3a0a0a' });
    text(`Coach Tanuki wins ${r.as} - ${r.ps}`, W / 2, 132, { size: 18, color: '#f4ecd8', align: 'center' });
    const bob = Math.round(Math.abs(Math.sin(game.tick / 8)) * 6);
    drawSprite(TANUKI, W / 2 - 36, 170 - bob, 6);
    text('"Ha! Come back when your paws are faster!"', W / 2, 312, { size: 16, color: '#ffd84a', align: 'center' });
  }
  text(`RECORD  W ${game.wins}  -  L ${game.losses}`, W / 2, 352, { size: 14, color: '#9a8fb0', align: 'center' });
  if (Math.floor(game.tick / 30) % 2 === 0) {
    text('SPACE: Return to Island     R: Rematch', W / 2, 410, { size: 18, color: '#ffffff', align: 'center', shadow: '#e0403a' });
  }
  drawParticles();
}

/* =========================================================
   MAIN LOOP (fixed 60 Hz update, render every frame)
   ========================================================= */
function update() {
  game.tick++; game.stateTick++;
  if (hit('KeyM')) game.muted = !game.muted;
  updateParticles();
  switch (game.state) {
    case STATES.MENU: updateMenu(); break;
    case STATES.OVERWORLD: updateOverworld(); break;
    case STATES.DIALOGUE: updateDialogue(); break;
    case STATES.MINIGAME: updateMinigame(); break;
    case STATES.GAME_OVER: updateGameOver(); break;
  }
  game.shake *= 0.85;
  if (game.shake < 0.3) game.shake = 0;
}
function draw() {
  ctx.imageSmoothingEnabled = false;
  ctx.save();
  if (game.shake) ctx.translate(Math.round(rand(-game.shake, game.shake)), Math.round(rand(-game.shake, game.shake)));
  switch (game.state) {
    case STATES.MENU: drawMenu(); break;
    case STATES.OVERWORLD:
    case STATES.DIALOGUE: drawOverworld(); break;
    case STATES.MINIGAME: drawMinigame(); break;
    case STATES.GAME_OVER: drawGameOver(); break;
  }
  ctx.restore();
  if (game.muted) text('MUTED', W - 10, H - 8, { size: 10, color: '#9a8fb0', align: 'right', bold: false });
}

const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(now - last, 250);
  last = now;
  while (acc >= STEP) {
    update();
    pressed.clear();
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
