<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champion Isle 3D</title>
<style>
  :root {
    --bg: #0d0b1a;
    --frame: #f0a020;
    --frame-dark: #8a4a10;
    --glow: rgba(240, 160, 32, 0.35);
    --text: #f4ecd8;
    --muted: #9a8fb0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 40%, #1d1838 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Courier New", Courier, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; overflow: hidden;
  }
  #gameContainer {
    position: relative;
    border: 4px solid var(--frame);
    box-shadow: 0 0 0 4px var(--frame-dark), 0 0 30px var(--glow);
    background: #000; line-height: 0;
  }
  #gameCanvas, #hudCanvas {
    display: block;
    width: min(94vw, calc((100vh - 70px) * 800 / 480));
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #hudCanvas { position: absolute; left: 0; top: 0; pointer-events: none; }
  .hint { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-align: center; padding: 0 12px; }
  .hint b { color: var(--frame); }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="480"></canvas>
  <canvas id="hudCanvas" width="800" height="480"></canvas>
</div>
<div class="hint">
  <b>WASD / Arrows</b> move &nbsp;·&nbsp; <b>E</b> talk / advance &nbsp;·&nbsp; <b>Space</b> start
  &nbsp;·&nbsp; <b>Esc</b> leave &nbsp;·&nbsp; <b>M</b> sound on/off
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

/* =========================================================
   CORE SETUP
   ========================================================= */
const canvas = document.getElementById('gameCanvas');
const hud = document.getElementById('hudCanvas');
const ctx = hud.getContext('2d');
const W = 800, H = 480;
const COLS = 25, ROWS = 15;
ctx.imageSmoothingEnabled = false;

if (!window.THREE) {
  ctx.fillStyle = '#120e26'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f0a020'; ctx.font = 'bold 20px "Courier New", monospace'; ctx.textAlign = 'center';
  ctx.fillText('Could not load the 3D engine.', W / 2, H / 2 - 10);
  ctx.fillStyle = '#f4ecd8'; ctx.font = '14px "Courier New", monospace';
  ctx.fillText('Check your internet connection and refresh the page.', W / 2, H / 2 + 20);
  throw new Error('THREE not loaded');
}

const STATES = Object.freeze({
  MENU: 'MENU', OVERWORLD: 'OVERWORLD', MINIGAME: 'MINIGAME',
  DIALOGUE: 'DIALOGUE', GAME_OVER: 'GAME_OVER'
});
const game = {
  state: STATES.MENU, tick: 0, stateTick: 0,
  scrolls: 0, wins: 0, losses: 0,
  beatChampion: false, talkedToCoach: false,
  doorArmed: true, shake: 0, muted: false, result: null
};
function setState(s) { game.state = s; game.stateTick = 0; }

/* =========================================================
   UTILITIES (HUD drawing on the 2D overlay canvas)
   ========================================================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
function hash(x, y, s = 0) {
  let h = Math.imul(x + s * 31, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function px(x, y, w, h, c, g = ctx) {
  g.fillStyle = c;
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function pixelCircle(cx, cy, r, c, g = ctx, step = 2) {
  g.fillStyle = c;
  for (let dy = -r; dy < r; dy += step) {
    const yy = dy + step / 2;
    const hw = Math.round(Math.sqrt(Math.max(0, r * r - yy * yy)) / step) * step;
    g.fillRect(Math.round(cx - hw), Math.round(cy + dy), hw * 2, step);
  }
}
function text(str, x, y, { size = 16, color = '#fff', align = 'left', shadow = '#000', bold = true } = {}) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px "Courier New", monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, x + 2, y + 2); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function panel(x, y, w, h, border = '#f0a020', fill = '#120e26') {
  px(x, y, w, h, border);
  px(x + 3, y + 3, w - 6, h - 6, '#000');
  px(x + 5, y + 5, w - 10, h - 10, fill);
}
function wrap(str, maxW) {
  const words = str.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* =========================================================
   INPUT
   ========================================================= */
const held = new Set(), pressed = new Set();
const BLOCK = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  initAudio();
  if (!e.repeat) pressed.add(e.code);
  held.add(e.code);
});
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => held.clear());
const isDown = (...c) => c.some(k => held.has(k));
const hit = (...c) => c.some(k => pressed.has(k));
const UP = ['ArrowUp', 'KeyW'], DOWN = ['ArrowDown', 'KeyS'];
const LEFT = ['ArrowLeft', 'KeyA'], RIGHT = ['ArrowRight', 'KeyD'];

/* =========================================================
   AUDIO (Web Audio chiptune blips)
   ========================================================= */
let actx = null;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur = 0.08, type = 'square', vol = 0.06, slide = 0, delay = 0) {
  if (!actx || game.muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  blip: (f = 880) => tone(f, 0.03, 'square', 0.03),
  select: () => { tone(523, 0.08); tone(784, 0.12, 'square', 0.06, 0, 0.08); },
  move: () => tone(440, 0.04, 'square', 0.04),
  hit: () => tone(620, 0.05, 'square', 0.07, 120),
  hitAI: () => tone(440, 0.05, 'square', 0.07, 80),
  bounce: () => tone(900, 0.025, 'triangle', 0.08),
  wall: () => tone(300, 0.03, 'triangle', 0.07),
  score: () => { tone(784, 0.08); tone(988, 0.08, 'square', 0.06, 0, 0.08); tone(1319, 0.16, 'square', 0.06, 0, 0.16); },
  miss: () => { tone(330, 0.1, 'square', 0.06, -80); tone(220, 0.18, 'square', 0.06, -60, 0.1); },
  count: () => tone(660, 0.08, 'square', 0.05),
  go: () => tone(1046, 0.18, 'square', 0.06),
  win: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.12, 'square', 0.06, 0, i * 0.11)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.16, 'square', 0.06, 0, i * 0.15))
};

/* =========================================================
   2D HUD PARTICLES (confetti on the results screen)
   ========================================================= */
let hudParticles = [];
function hudBurst(x, y, color, n = 12, spd = 3, grav = 0) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd + 0.5;
    hudParticles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: grav, life: 1,
      decay: 0.012 + Math.random() * 0.02, size: (Math.random() * 3 + 3) | 0, color });
  }
}
function updateHudParticles() {
  for (let i = hudParticles.length - 1; i >= 0; i--) {
    const p = hudParticles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.97;
    p.life -= p.decay;
    if (p.life <= 0) hudParticles.splice(i, 1);
  }
}
function drawHudParticles() {
  for (const p of hudParticles) { ctx.globalAlpha = Math.max(0, p.life); px(p.x, p.y, p.size, p.size, p.color); }
  ctx.globalAlpha = 1;
}

/* =========================================================
   2D PIXEL SPRITES (dialogue portraits + results screen)
   ========================================================= */
function makeSprite(rows, pal) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x];
    if (ch === '.' || !pal[ch]) continue;
    g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1);
  }
  return c;
}
function drawSprite(spr, x, y, scale = 3) {
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, Math.round(x), Math.round(y), spr.width * scale, spr.height * scale);
}
const CAT_SPRITE = makeSprite([
  '.k........k.', 'kok......kbk', 'kookkkkkkbbk', 'koowwwwwwbbk', 'kwwkwwwwkwwk', 'kwwkwwwwkwwk',
  'kwwwwppwwwwk', '.kwwwwwwwwk.', '.kwoowwbbwk.', '.kwoowwbbwk.', '.kwwwkkwwwk.', '.kkk....kkk.'
], { k: '#1b1420', w: '#f6efe0', o: '#e8822e', b: '#2b2530', p: '#f39ab4' });
const TANUKI_SPRITE = makeSprite([
  '.kk......kk.', 'kbbk....kbbk', 'kbrrrrrrrrbk', 'kttttttttttk', 'kbbbttttbbbk', 'kbwbttttbwbk',
  'kttttkkttttk', '.kttccccttk.', '.kggggggggk.', '.kgggrrgggk.', '.kggggggggk.', '.kkk....kkk.'
], { k: '#1b1420', b: '#4a3428', r: '#e0403a', t: '#b07a4a', w: '#ffffff', c: '#f1dcb4', g: '#f2f2f2' });

/* =========================================================
   THREE.JS RENDERER + SHARED 3D HELPERS
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 200);

const matCache = {};
function mat(color, emissive) {
  const key = color + (emissive || '');
  if (!matCache[key]) matCache[key] = new THREE.MeshLambertMaterial({ color, emissive: emissive || 0x000000 });
  return matCache[key];
}
const UNIT_BOX = new THREE.BoxGeometry(1, 1, 1);
function box(w, h, d, color, x = 0, y = 0, z = 0, parent = null, material = null) {
  const m = new THREE.Mesh(UNIT_BOX, material || mat(color));
  m.scale.set(w, h, d);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
function addLights(scene, sky, ground, shadowSize) {
  scene.add(new THREE.HemisphereLight(sky, ground, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(7, 14, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const s = sun.shadow.camera;
  s.left = -shadowSize; s.right = shadowSize; s.top = shadowSize; s.bottom = -shadowSize;
  s.near = 1; s.far = 50; s.updateProjectionMatrix();
  scene.add(sun); scene.add(sun.target);
  return sun;
}

/* ---------- 3D particle pool (paddle hits, bounces, points) ---------- */
function makeParticlePool(scene, count = 160) {
  const pool = [];
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(UNIT_BOX, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    m.visible = false; scene.add(m);
    pool.push({ m, vx: 0, vy: 0, vz: 0, life: 0, decay: 0, size: 0.08 });
  }
  return pool;
}
function burst3D(pool, x, y, z, color, n = 12, spd = 0.08) {
  let made = 0;
  for (const p of pool) {
    if (made >= n) break;
    if (p.life > 0) continue;
    const a = Math.random() * Math.PI * 2, e = rand(-0.3, 1.2), s = rand(0.3, 1) * spd;
    p.vx = Math.cos(a) * Math.cos(e) * s; p.vz = Math.sin(a) * Math.cos(e) * s; p.vy = Math.sin(e) * s + 0.02;
    p.life = 1; p.decay = rand(0.02, 0.045); p.size = rand(0.05, 0.11);
    p.m.material.color.set(color);
    p.m.position.set(x, y, z); p.m.visible = true;
    made++;
  }
}
function updatePool(pool) {
  for (const p of pool) {
    if (p.life <= 0) continue;
    p.m.position.x += p.vx; p.m.position.y += p.vy; p.m.position.z += p.vz;
    p.vy -= 0.004; p.vx *= 0.96; p.vz *= 0.96;
    p.life -= p.decay;
    const s = Math.max(0.001, p.size * p.life);
    p.m.scale.set(s, s, s);
    p.m.rotation.x += 0.2; p.m.rotation.y += 0.15;
    if (p.life <= 0) p.m.visible = false;
  }
}
function clearPool(pool) { for (const p of pool) { p.life = 0; p.m.visible = false; } }

/* ---------- voxel characters ---------- */
function legPivot(parent, x, z, color) {
  const pivot = new THREE.Group();
  pivot.position.set(x, 0.24, z);
  box(0.12, 0.24, 0.12, color, 0, -0.12, 0, pivot);
  parent.add(pivot);
  return pivot;
}
function makeCat() {
  const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  box(0.46, 0.34, 0.62, '#f6efe0', 0, 0.39, 0, body);
  box(0.3, 0.05, 0.32, '#e8822e', -0.07, 0.57, -0.04, body);
  box(0.22, 0.05, 0.22, '#2b2530', 0.1, 0.57, -0.2, body);
  const head = new THREE.Group(); head.position.set(0, 0.68, 0.32); body.add(head);
  box(0.48, 0.4, 0.4, '#f6efe0', 0, 0, 0, head);
  box(0.25, 0.12, 0.42, '#e8822e', -0.12, 0.15, 0, head);
  box(0.2, 0.1, 0.42, '#2b2530', 0.13, 0.16, 0, head);
  box(0.13, 0.15, 0.08, '#e8822e', -0.16, 0.27, -0.04, head);
  box(0.13, 0.15, 0.08, '#2b2530', 0.16, 0.27, -0.04, head);
  box(0.07, 0.09, 0.02, '#1b1420', -0.1, 0.03, 0.205, head);
  box(0.07, 0.09, 0.02, '#1b1420', 0.1, 0.03, 0.205, head);
  box(0.07, 0.04, 0.02, '#f39ab4', 0, -0.06, 0.205, head);
  const legs = [legPivot(body, -0.14, 0.2, '#f6efe0'), legPivot(body, 0.14, 0.2, '#f6efe0'),
    legPivot(body, -0.14, -0.2, '#e8822e'), legPivot(body, 0.14, -0.2, '#f6efe0')];
  const tail = new THREE.Group(); tail.position.set(0, 0.48, -0.31); body.add(tail);
  box(0.08, 0.08, 0.26, '#e8822e', 0, 0.06, -0.12, tail).rotation.x = -0.6;
  box(0.09, 0.09, 0.12, '#2b2530', 0, 0.2, -0.24, tail).rotation.x = -0.9;
  return { group: g, body, head, legs, tail };
}
function makeTanuki() {
  const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  box(0.5, 0.42, 0.48, '#f2f2f2', 0, 0.45, 0, body);
  box(0.52, 0.08, 0.5, '#e0403a', 0, 0.4, 0, body);
  box(0.16, 0.1, 0.04, '#e0403a', 0.14, 0.36, 0.26, body);
  const head = new THREE.Group(); head.position.set(0, 0.86, 0.04); body.add(head);
  box(0.5, 0.42, 0.42, '#b07a4a', 0, 0, 0, head);
  box(0.52, 0.08, 0.44, '#e0403a', 0, 0.15, 0, head);
  box(0.06, 0.06, 0.2, '#e0403a', 0, 0.15, -0.28, head);
  box(0.18, 0.1, 0.02, '#4a3428', -0.13, 0.02, 0.215, head);
  box(0.18, 0.1, 0.02, '#4a3428', 0.13, 0.02, 0.215, head);
  box(0.06, 0.06, 0.03, '#ffffff', -0.12, 0.03, 0.22, head);
  box(0.06, 0.06, 0.03, '#ffffff', 0.12, 0.03, 0.22, head);
  box(0.22, 0.12, 0.08, '#f1dcb4', 0, -0.1, 0.22, head);
  box(0.06, 0.05, 0.03, '#1b1420', 0, -0.06, 0.26, head);
  box(0.12, 0.12, 0.08, '#4a3428', -0.18, 0.26, 0, head);
  box(0.12, 0.12, 0.08, '#4a3428', 0.18, 0.26, 0, head);
  const legs = [legPivot(body, -0.14, 0.12, '#4a3428'), legPivot(body, 0.14, 0.12, '#4a3428'),
    legPivot(body, -0.14, -0.12, '#4a3428'), legPivot(body, 0.14, -0.12, '#4a3428')];
  const tail = new THREE.Group(); tail.position.set(0, 0.36, -0.26); body.add(tail);
  box(0.16, 0.16, 0.18, '#b07a4a', 0, 0, -0.08, tail);
  box(0.17, 0.17, 0.08, '#4a3428', 0, 0, -0.18, tail);
  box(0.14, 0.14, 0.1, '#b07a4a', 0, 0, -0.26, tail);
  return { group: g, body, head, legs, tail };
}
function animateCritter(c, moving, phase) {
  const sw = moving ? Math.sin(phase * 0.35) * 0.7 : 0;
  c.legs[0].rotation.x = sw; c.legs[3].rotation.x = sw;
  c.legs[1].rotation.x = -sw; c.legs[2].rotation.x = -sw;
  c.body.position.y = moving ? Math.abs(Math.sin(phase * 0.35)) * 0.05 : Math.sin(game.tick / 25) * 0.015;
  c.tail.rotation.y = Math.sin(game.tick / 9) * 0.5;
}

/* =========================================================
   ISLAND SCENE (overworld + menu backdrop)
   ~ water  s sand  g grass  p path  f flowers  T tree  r rock
   A arena (row 4 = lanterns)  D arena door  P torii pillar
   ========================================================= */
const MAP = [
  '~~~~~~~~~~~~~~~~~~~~~~~~~',
  '~~sssssssssssssssssssss~~',
  '~ssTggggggAAAAAAAggggTss~',
  '~sgggfgggrAAAAAAAgggfggs~',
  '~sggggggggAAADAAAggggggs~',
  '~sgggggggggggpgggggggggs~',
  '~sgTggggggggPpPggggggggs~',
  '~sgpppppppppppppppppppgs~',
  '~sgpgggggggggpggggggrpgs~',
  '~sgpggTggggggpgggggggpgs~',
  '~sgpgggfgggggpggggTggpgs~',
  '~sgpppppppppppppppppppgs~',
  '~ssgggrggggggpggggggggss~',
  '~~sssssssssssssssssssss~~',
  '~~~~~~~~~~~~~~~~~~~~~~~~~'
];
const SOLID = new Set(['~', 'T', 'r', 'A', 'P']);
const tx = c => c - COLS / 2 + 0.5;
const tz = r => r - ROWS / 2 + 0.5;
const tileAt = (x, z) => {
  const c = Math.floor(x + COLS / 2), r = Math.floor(z + ROWS / 2);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return '~';
  return MAP[r][c];
};
const groundTop = t => t === 's' ? 0.05 : (t === 'p' || t === 'D') ? 0.12 : t === '~' ? -0.15 : 0.18;

const island = new THREE.Scene();
island.background = new THREE.Color('#8fd3ff');
island.fog = new THREE.Fog('#8fd3ff', 20, 48);
addLights(island, 0xcfeeff, 0x4a7a3a, 15);

// animated low-poly sea
const seaGeo = new THREE.PlaneGeometry(90, 70, 45, 35);
seaGeo.rotateX(-Math.PI / 2);
const sea = new THREE.Mesh(seaGeo, new THREE.MeshPhongMaterial({ color: '#2b6fd6', flatShading: true, shininess: 80, transparent: true, opacity: 0.92 }));
sea.position.y = -0.15; sea.receiveShadow = true;
island.add(sea);
const seaBase = Float32Array.from(seaGeo.attributes.position.array);
function updateSea() {
  const pos = seaGeo.attributes.position, t = game.tick * 0.03;
  for (let i = 0; i < pos.count; i++) {
    const x = seaBase[i * 3], z = seaBase[i * 3 + 2];
    pos.array[i * 3 + 1] = Math.sin(x * 0.6 + t) * 0.06 + Math.cos(z * 0.7 + t * 1.3) * 0.06;
  }
  pos.needsUpdate = true;
  seaGeo.computeVertexNormals();
}

function buildIsland() {
  const g = new THREE.Group();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = MAP[r][c];
    if (t === '~') continue;
    const x = tx(c), z = tz(r), top = groundTop(t), alt = (c + r) % 2 === 0;
    const col = t === 's' ? (alt ? '#e8d08a' : '#e2c77e')
      : (t === 'p' || t === 'D') ? (alt ? '#c9a46a' : '#c19c62')
      : (alt ? '#5cae4a' : '#55a544');
    const ground = box(1, 1, 1, col, x, top - 0.5, z, g);
    ground.castShadow = false;

    if (t === 'T') {

const dlg = { speaker: '', portrait: null, lines: [], i: 0, shown: 0, onDone: null, canLeave: false };
function openDialogue(speaker, portrait, lines, onDone = null, canLeave = false) {
  Object.assign(dlg, { speaker, portrait, lines, i: 0, shown: 0, onDone, canLeave });
  setState(STATES.DIALOGUE);
}
function updateDialogue() {
  const line = dlg.lines[dlg.i];
  if (dlg.shown < line.length) {
    const before = Math.floor(dlg.shown);
    dlg.shown = Math.min(line.length, dlg.shown + 0.8);
    const now = Math.floor(dlg.shown);
    if (now !== before && now % 2 === 0 && line[now - 1] !== ' ') SFX.blip(dlg.portrait ? 520 : 880);
  }
  if (hit('Escape')) {
    setState(STATES.OVERWORLD);
    if (dlg.canLeave) { player.z = tz(5) + 0.2; player.angle = 0; }
    return;
  }
  if (hit('KeyE', 'Enter')) {
    if (dlg.shown < line.length) { dlg.shown = line.length; return; }
    dlg.i++; dlg.shown = 0;
    SFX.blip(660);
    if (dlg.i >= dlg.lines.length) {
      setState(STATES.OVERWORLD);
      if (dlg.onDone) dlg.onDone();
    }
  }
}
function drawDialogue() {
  const bx = 24, by = H - 132, bw = W - 48, bh = 112;

  panel(bx + 12, by - 24, nw, 30, '#f0a020', '#e0403a');
  text(dlg.speaker, bx + 26, by - 4, { size: 14, color: '#fff' });
  ctx.font = 'bold 17px "Courier New", monospace';
  const lines = wrap(dlg.lines[dlg.i], bx + bw - tX - 24);
  let left = Math.floor(dlg.shown);
  lines.forEach((ln, li) => {
    if (left <= 0) return;
    text(ln.slice(0, left), tX, by + 36 + li * 22, { size: 17, color: '#f4ecd8' });

const nearNpc = () => Math.hypot(player.x - npc.x, player.z - npc.z) < 1.4;
function updateOverworld() {
  let dx = (isDown(...RIGHT) ? 1 : 0) - (isDown(...LEFT) ? 1 : 0);
  let dz = (isDown(...DOWN) ? 1 : 0) - (isDown(...UP) ? 1 : 0);
  player.moving = !!(dx || dz);
  if (dx && dz) { dx *= 0.7071; dz *= 0.7071; }
  const sp = 0.075;
  if (!blocked(player.x + dx * sp, player.z)) player.x += dx * sp;
  if (!blocked(player.x, player.z + dz * sp)) player.z += dz * sp;
  if (player.moving) {
    const target = Math.atan2(dx, dz);
    let diff = target - player.angle;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.angle += diff * 0.25;
    player.anim++;
    if (player.anim % 12 === 0) burst3D(islandParticles, player.x, player.y + 0.05, player.z, '#d6c49a', 3, 0.025);
  } else player.anim = 0;
  player.y = lerp(player.y, groundTop(tileAt(player.x, player.z)), 0.3);

  // NPC turns to face the player when close
  const want = Math.atan2(player.x - npc.x, player.z - npc.z);
  const cur = tanukiModel.group.rotation.y;
  const target = nearNpc() ? want : 0;
  tanukiModel.group.rotation.y = cur + Math.atan2(Math.sin(target - cur), Math.cos(target - cur)) * 0.12;

  if (nearNpc() && hit('KeyE')) {
    game.talkedToCoach = true;
    openDialogue('COACH TANUKI', TANUKI_SPRITE, coachLines());
    return;
  }
  const c = Math.floor(player.x + COLS / 2), r = Math.floor(player.z + ROWS / 2);
  const onDoor = c === doorTile.c && r === doorTile.r;
  if (onDoor && game.doorArmed) {
    game.doorArmed = false;
    openDialogue('ARENA SIGN', null, game.beatChampion
      ? ['TABLE TENNIS ARENA - Rematch the champion?', 'Press E to step onto the court!']
      : ['TABLE TENNIS ARENA', 'First to 3 points wins. Move your paddle with W/S or the Arrow keys.', 'Press E to step onto the court!'],
      startMatch, true);
    return;
  }
  if (!onDoor) game.doorArmed = true;
}

  const x = -10.5 + i * 0.9 + (row % 2) * 0.45, y = 0.5 + row * 0.5, z = -6.5 - row * 1.2;
  const m = box(0.42, 0.42, 0.42, crowdCols[(i + row * 2) % 6], x, y + 0.21, z, arena);
  box(0.08, 0.08, 0.02, '#1b1420', -0.25, 0.1, 0.51, m).scale.set(0.2, 0.2, 0.05);
  crowd.push({ m, baseY: y + 0.21, p: rand(0, 6.28) });
}
function makePaddle(color) {
  const g = new THREE.Group();
  const faceMat = new THREE.MeshLambertMaterial({ color, emissive: 0x000000 });
  const face = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.07, 16), faceMat);
  face.rotation.z = Math.PI / 2; face.scale.set(1, 1, 1.33); face.castShadow = true;
  g.add(face);
  box(0.06, 0.32, 0.1, '#c48a4a', 0, -0.5, 0, g);
  return { group: g, faceMat };
}
const pPaddle = makePaddle('#30a0f0'), aPaddle = makePaddle('#e04848');
arena.add(pPaddle.group, aPaddle.group);
const arenaCat = makeCat(), arenaTanuki = makeTanuki();
arenaCat.group.scale.setScalar(1.6); arenaTanuki.group.scale.setScalar(1.6);
arenaCat.group.rotation.y = Math.PI / 2; arenaTanuki.group.rotation.y = -Math.PI / 2;
arena.add(arenaCat.group, arenaTanuki.group);
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BR, 12, 8), new THREE.MeshLambertMaterial({ color: '#ffffff', emissive: '#555555' }));
ballMesh.castShadow = true; arena.add(ballMesh);
const ballShadow = new THREE.Mesh(new THREE.CircleGeometry(0.12, 12), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 }));
ballShadow.rotation.x = -Math.PI / 2; arena.add(ballShadow);
const trail = [];
for (let i = 0; i < 6; i++) {
  const t = new THREE.Mesh(new THREE.SphereGeometry(BR * 0.8, 8, 6), new THREE.MeshBasicMaterial({ color: '#ffd84a', transparent: true, opacity: 0.08 + i * 0.05 }));
  arena.add(t); trail.push(t);
}
const arenaParticles = makeParticlePool(arena, 160);

/* =========================================================
   MINIGAME STATE: TABLE TENNIS
   (2D court logic on the table's x/z plane; ball height is a
    cosmetic arc with a real bounce on the far side)
   ========================================================= */
const mg = {
  pz: 0, pvz: 0, az: 0, avz: 0,
  ball: { x: 0, z: 0, vx: 0, vz: 0, speed: 0.075, visible: true, fromX: 0, toX: 0, u: 0, h: 0.4 },
  history: [], ps: 0, as: 0, phase: 'countdown', timer: 0, rally: 0,
  serveDir: 1, aiTarget: 0, aiTimer: 0, aiOffset: 0,
  banner: '', bannerT: 0, pFlash: 0, aFlash: 0, pHop: 0, aHop: 0
};
function centerBall() {
  const b = mg.ball;
  Object.assign(b, { x: 0, z: 0, vx: 0, vz: 0, visible: true, fromX: 0, toX: 0, u: 0, h: 0.45 });
  mg.history = [];
}
function startMatch() {
  mg.ps = 0; mg.as = 0; mg.rally = 0;
  mg.pz = 0; mg.az = 0;
  mg.serveDir = Math.random() < 0.5 ? -1 : 1;
  mg.phase = 'countdown'; mg.timer = 180;
  mg.banner = ''; mg.bannerT = 0;
  clearPool(arenaParticles);
  centerBall();
  setState(STATES.MINIGAME);
}
function serve() {
  const b = mg.ball, ang = rand(-0.5, 0.5);
  b.speed = 0.075;
  b.vx = Math.cos(ang) * b.speed * mg.serveDir;
  b.vz = Math.sin(ang) * b.speed;
  b.fromX = 0; b.toX = mg.serveDir > 0 ? PXR : PXL; b.u = 0;
  mg.rally = 0;
  mg.aiOffset = rand(-0.2, 0.2);
  mg.phase = 'play';
}
function predictZ() {
  const b = mg.ball;
  if (b.vx <= 0) return 0;
  const t = (PXR - BR - b.x) / b.vx;
  const top = -LZ + BR, span = 2 * (LZ - BR);
  let rel = b.z + b.vz * t - top;
  rel = ((rel % (2 * span)) + 2 * span) % (2 * span);
  if (rel > span) rel = 2 * span - rel;
  return top + rel;
}
function paddleHit(dir, pz, pvz) {
  const b = mg.ball;
  const rel = clamp((b.z - pz) / PHW, -1, 1);
  b.speed = Math.min(b.speed + 0.008, 0.2);
  const ang = rel * 1.0;
  b.vx = Math.cos(ang) * b.speed * dir;
  b.vz = Math.sin(ang) * b.speed + pvz * 0.2;
  b.fromX = b.x; b.toX = dir > 0 ? PXR : PXL; b.u = 0;
  mg.rally++;
  game.shake = Math.max(game.shake, 0.08);
  const y = TY + 0.15;
  if (dir === 1) {
    burst3D(arenaParticles, b.x, y, b.z, '#30a0f0', 14, 0.09); SFX.hit(); mg.pFlash = 8; mg.pHop = 0.25;
    const missChance = 0.12 + Math.min(mg.rally, 20) * 0.012;
    mg.aiOffset = Math.random() < missChance
      ? (Math.random() < 0.5 ? -1 : 1) * (PHW * 1.25 + rand(0, 0.35))
      : rand(-0.25, 0.25);
  } else {
    burst3D(arenaParticles, b.x, y, b.z, '#e0403a', 14, 0.09); SFX.hitAI(); mg.aFlash = 8; mg.aHop = 0.25;
  }
}
function pointTo(who) {
  const b = mg.ball;
  b.visible = false;
  game.shake = 0.25;
  if (who === 'player') {
    mg.ps++; mg.serveDir = 1;
    burst3D(arenaParticles, PXR + 0.6, TY + 0.4, b.z, '#30a0f0', 30, 0.14);
    burst3D(arenaParticles, PXR + 0.6, TY + 0.4, b.z, '#ffd84a', 20, 0.12);
    mg.banner = 'POINT!'; SFX.score();
  } else {
    mg.as++; mg.serveDir = -1;
    burst3D(arenaParticles, PXL - 0.6, TY + 0.4, b.z, '#e0403a', 30, 0.14);
    mg.banner = 'MISS!'; SFX.miss();
  }
  mg.bannerT = 70;
  if (mg.ps >= WIN_SCORE || mg.as >= WIN_SCORE) {
    mg.phase = 'end'; mg.timer = 100;
    mg.banner = mg.ps >= WIN_SCORE ? 'MATCH!' : 'GAME!';
  } else { mg.phase = 'point'; mg.timer = 75; }
}
function finishMatch() {
  const won = mg.ps >= WIN_SCORE;
  game.result = { won, ps: mg.ps, as: mg.as, first: false };
  if (won) {
    game.wins++;
    if (!game.beatChampion) { game.beatChampion = true; game.scrolls++; game.result.first = true; }
    SFX.win();
  } else { game.losses++; SFX.lose(); }
  hudParticles = [];
  setState(STATES.GAME_OVER);
}
function ballHeight(b) {
  const span = b.toX - b.fromX;
  const u = span ? (b.x - b.fromX) / span : 0;
  if (u >= 1) return 0.15 - (u - 1) * Math.abs(span) * 1.2;   // past the paddle: drops off the table
  if (u < 0.72) { const a = Math.max(0, u) / 0.72; return (1 - a) * 0.15 + 0.6 * 4 * a * (1 - a); }
  const a = (u - 0.72) / 0.28; return a * 0.15 + 0.32 * 4 * a * (1 - a);
}
function stepBall() {
  const b = mg.ball;
  const steps = Math.ceil(Math.max(Math.abs(b.vx), Math.abs(b.vz)) / 0.05);
  for (let s = 0; s < steps; s++) {
    b.x += b.vx / steps; b.z += b.vz / steps;
    if (b.z - BR < -LZ) { b.z = -LZ + BR; b.vz = Math.abs(b.vz); SFX.wall(); }
    else if (b.z + BR > LZ) { b.z = LZ - BR; b.vz = -Math.abs(b.vz); SFX.wall(); }
    if (b.vx < 0 && b.x - BR <= PXL + 0.05 && b.x >= PXL - 0.35 && Math.abs(b.z - mg.pz) <= PHW + BR) {
      b.x = PXL + 0.05 + BR; paddleHit(1, mg.pz, mg.pvz);
    }
    if (b.vx > 0 && b.x + BR >= PXR - 0.05 && b.x <= PXR + 0.35 && Math.abs(b.z - mg.az) <= PHW + BR) {
      b.x = PXR - 0.05 - BR; paddleHit(-1, mg.az, mg.avz);
    }
    if (b.x < -6.4) { pointTo('ai'); return; }
    if (b.x > 6.4) { pointTo('player'); return; }
  }
  const span = b.toX - b.fromX;
  const u = span ? (b.x - b.fromX) / span : 0;
  if (b.u < 0.72 && u >= 0.72) {   // ball bounces on the far half of the table
    burst3D(arenaParticles, b.x, TY + 0.02, b.z, '#ffffff', 5, 0.03);
    SFX.bounce();
  }
  b.u = u;
  b.h = ballHeight(b);
  mg.history.push({ x: b.x, y: TY + BR + b.h, z: b.z });
  if (mg.history.length > 12) mg.history.shift();
}
function updateMinigame() {
  if (hit('Escape')) { returnToIsland(); return; }
  const pv = (isDown(...DOWN) ? 1 : 0) - (isDown(...UP) ? 1 : 0);
  mg.pvz = pv * 0.11;
  mg.pz = clamp(mg.pz + mg.pvz, -LZ - 0.2, LZ + 0.2);

  if (--mg.aiTimer <= 0) {
    mg.aiTimer = 6;
    mg.aiTarget = (mg.phase === 'play' && mg.ball.vx > 0) ? predictZ() + mg.aiOffset : 0;
  }
  const maxS = clamp(0.066 + 0.005 * (mg.ps - mg.as) + Math.min(mg.rally, 20) * 0.0005, 0.052, 0.095);
  mg.avz = clamp((mg.aiTarget - mg.az) * 0.18, -maxS, maxS);
  mg.az = clamp(mg.az + mg.avz, -LZ - 0.2, LZ + 0.2);

  if (mg.phase === 'countdown') {
    if (mg.timer % 60 === 0 && mg.timer > 0) SFX.count();
    if (--mg.timer <= 0) { serve(); SFX.go(); mg.banner = 'GO!'; mg.bannerT = 40; }
  } else if (mg.phase === 'serve') {
    if (--mg.timer <= 0) { serve(); SFX.go(); }
  } else if (mg.phase === 'play') {
    stepBall();
  } else if (mg.phase === 'point') {
    if (--mg.timer <= 0) { centerBall(); mg.phase = 'serve'; mg.timer = 45; mg.banner = 'READY...'; mg.bannerT = 45; }
  } else if (mg.phase === 'end') {
    if (--mg.timer <= 0) finishMatch();
  }
  if (mg.bannerT > 0) mg.bannerT--;
  mg.pFlash = Math.max(0, mg.pFlash - 1); mg.aFlash = Math.max(0, mg.aFlash - 1);
  mg.pHop *= 0.85; mg.aHop *= 0.85;

  const t = Math.min(1, game.stateTick / 90);
  camera.position.set(0, lerp(9, 6.8, t), lerp(11.5, 8.8, t));
  camera.lookAt(0, 0.6, 0.6);
}
function updateArenaVisuals() {
  const b = mg.ball;
  pPaddle.group.position.set(PXL, TY + 0.32, mg.pz);
  aPaddle.group.position.set(PXR, TY + 0.32, mg.az);
  pPaddle.group.rotation.z = -0.15; aPaddle.group.rotation.z = 0.15;
  pPaddle.faceMat.emissive.set(mg.pFlash > 4 ? '#ffffff' : '#000000');
  aPaddle.faceMat.emissive.set(mg.aFlash > 4 ? '#ffffff' : '#000000');
  arenaCat.group.position.set(PXL - 0.9, mg.pHop, mg.pz);
  arenaTanuki.group.position.set(PXR + 0.9, mg.aHop, mg.az);
  animateCritter(arenaCat, Math.abs(mg.pvz) > 0.01, game.tick);
  animateCritter(arenaTanuki, Math.abs(mg.avz) > 0.01, game.tick);

  ballMesh.visible = b.visible;
  ballMesh.position.set(b.x, TY + BR + b.h, b.z);
  const overTable = Math.abs(b.x) <= LX && b.visible;
  ballShadow.visible = overTable;
  ballShadow.position.set(b.x, TY + 0.005, b.z);
  ballShadow.scale.setScalar(1 + b.h * 0.8);
  trail.forEach((t, i) => {
    const hpt = mg.history[mg.history.length - 1 - (trail.length - 1 - i) * 2];
    t.visible = b.visible && mg.phase === 'play' && !!hpt;
    if (hpt) t.position.set(hpt.x, hpt.y, hpt.z);
  });
  const cheer = mg.bannerT > 0;
  for (const c of crowd) {
    c.m.position.y = c.baseY + Math.abs(Math.sin(game.tick / (cheer ? 4 : 18) + c.p)) * (cheer ? 0.3 : 0.06);
  }
  updatePool(arenaParticles);
}
function drawMinigameHud() {
  panel(290, 4, 220, 50, '#f0a020', '#120e26');
  text('YOU', 330, 24, { size: 12, color: '#30a0f0', align: 'center' });
  text('CHAMP', 470, 24, { size: 12, color: '#e04848', align: 'center' });
  text(`${mg.ps}`, 370, 42, { size: 28, color: '#30a0f0', align: 'center' });
  text('-', 400, 40, { size: 22, color: '#f4ecd8', align: 'center' });
  text(`${mg.as}`, 430, 42, { size: 28, color: '#e04848', align: 'center' });
  for (let i = 0; i < WIN_SCORE; i++) {
    px(312 + i * 12, 30, 8, 8, i < mg.ps ? '#30a0f0' : '#3a3370');
    px(452 + i * 12, 30, 8, 8, i < mg.as ? '#e04848' : '#3a3370');
  }
  if (mg.rally >= 3 && mg.phase === 'play') text(`RALLY x${mg.rally}`, W / 2, 470, { size: 14, color: '#ffd84a', align: 'center' });
  text('W/S or ↑/↓ move  ·  ESC: forfeit', W - 12, 472, { size: 11, color: '#c8bfe0', align: 'right', bold: false });
  if (mg.phase === 'countdown') {
    const n = Math.ceil(mg.timer / 60), s = 60 + (mg.timer % 60) * 0.6;
    text(String(n), W / 2, H / 2 + s / 3, { size: Math.round(s), color: '#ffd84a', align: 'center', shadow: '#7a2a10' });
    text('FIRST TO 3 WINS', W / 2, H / 2 + 70, { size: 16, color: '#f4ecd8', align: 'center' });
  }
  if (mg.bannerT > 0 && mg.banner) {
    const col = mg.banner === 'MISS!' || mg.banner === 'GAME!' ? '#e04848' : '#ffd84a';
    text(mg.banner, W / 2, H / 2 + 14, { size: 44, color: col, align: 'center', shadow: '#000' });
  }
}

/* =========================================================
   GAME OVER STATE
   ========================================================= */
function returnToIsland() {
  player.x = tx(13); player.z = tz(5) + 0.1; player.angle = 0;
  game.doorArmed = false;
  clearPool(islandParticles);
  followCamera(true);
  setState(STATES.OVERWORLD);
}
function updateGameOver() {
  const r = game.result;
  if (r && r.won && game.stateTick % 8 === 0) {
    const cols = ['#ffd84a', '#30a0f0', '#e0403a', '#5cdc6a', '#f39ab4'];
    hudBurst(rand(40, W - 40), rand(-10, 60), cols[Math.floor(rand(0, cols.length))], 6, 2, 0.08);
  }
  // orbit the arena while the winner celebrates
  const a = game.stateTick * 0.006;
  camera.position.set(Math.sin(a) * 10, 4.5, Math.cos(a) * 10);
  camera.lookAt(0, 0.8, 0);
  mg.ball.visible = false;
  const jump = Math.abs(Math.sin(game.stateTick / 9)) * 0.5;
  mg.pHop = r && r.won ? jump : 0;
  mg.aHop = r && !r.won ? jump : 0;
  if (game.stateTick > 30) {
    if (hit('Space', 'Enter')) { SFX.select(); returnToIsland(); }
    else if (hit('KeyR')) { SFX.select(); startMatch(); }
  }
}
function drawScroll(cx, cy) {
  px(cx - 40, cy - 24, 80, 48, '#f1dcb4'); px(cx - 40, cy - 24, 80, 4, '#d6b96c');
  for (let i = 0; i < 4; i++) px(cx - 28, cy - 12 + i * 8, 56 - (i % 2) * 14, 3, '#a0582a');
  px(cx - 48, cy - 30, 10, 60, '#e0403a'); px(cx + 38, cy - 30, 10, 60, '#e0403a');
  px(cx - 46, cy - 34, 6, 4, '#ffd84a'); px(cx + 40, cy - 34, 6, 4, '#ffd84a');
  px(cx - 46, cy + 30, 6, 4, '#ffd84a'); px(cx + 40, cy + 30, 6, 4, '#ffd84a');
}
function drawGameOverHud() {
  const r = game.result || { won: false, ps: 0, as: 0 };
  ctx.globalAlpha = 0.6; px(0, 0, W, H, r.won ? '#1a1436' : '#120c18'); ctx.globalAlpha = 1;
  if (r.won) {
    text('VICTORY!', W / 2, 92, { size: 56, color: '#ffd84a', align: 'center', shadow: '#7a2a10' });
    text(`You beat Coach Tanuki ${r.ps} - ${r.as}`, W / 2, 132, { size: 18, color: '#f4ecd8', align: 'center' });
    drawScroll(W / 2, 224 + Math.round(Math.sin(game.tick / 15) * 4));
    drawSprite(CAT_SPRITE, W / 2 - 160, 196, 5);
    text(r.first ? 'TABLE TENNIS SCROLL OBTAINED!' : 'CHAMPION DEFEATED AGAIN!', W / 2, 312, { size: 20, color: '#5cdc6a', align: 'center' });
  } else {
    text('DEFEAT', W / 2, 92, { size: 56, color: '#e04848', align: 'center', shadow: '#3a0a0a' });
    text(`Coach Tanuki wins ${r.as} - ${r.ps}`, W / 2, 132, { size: 18, color: '#f4ecd8', align: 'center' });
    drawSprite(TANUKI_SPRITE, W / 2 - 36, 170 - Math.round(Math.abs(Math.sin(game.tick / 8)) * 6), 6);
    text('"Ha! Come back when your paws are faster!"', W / 2, 312, { size: 16, color: '#ffd84a', align: 'center' });
  }
  text(`RECORD  W ${game.wins}  -  L ${game.losses}`, W / 2, 352, { size: 14, color: '#c8bfe0', align: 'center' });
  if (Math.floor(game.tick / 30) % 2 === 0) {
    text('SPACE: Return to Island     R: Rematch', W / 2, 410, { size: 18, color: '#ffffff', align: 'center', shadow: '#e0403a' });
  }
  drawHudParticles();
}

/* =========================================================
   MAIN LOOP (fixed 60 Hz update, render every frame)
   ========================================================= */
function update() {
  game.tick++; game.stateTick++;
  if (hit('KeyM')) game.muted = !game.muted;
  updateHudParticles();
  switch (game.state) {
    case STATES.MENU: updateMenu(); break;
    case STATES.OVERWORLD: updateOverworld(); break;
    case STATES.DIALOGUE: updateDialogue(); break;
    case STATES.MINIGAME: updateMinigame(); break;
    case STATES.GAME_OVER: updateGameOver(); break;
  }
  if (game.state === STATES.MENU || game.state === STATES.OVERWORLD || game.state === STATES.DIALOGUE) {
    updateIslandVisuals();
    if (game.state !== STATES.MENU) followCamera();
  } else {
    updateArenaVisuals();
  }
  game.shake *= 0.85;
  if (game.shake < 0.005) game.shake = 0;
}
function render() {
  const inArena = game.state === STATES.MINIGAME || game.state === STATES.GAME_OVER;
  if (game.shake) {
    camera.position.x += rand(-game.shake, game.shake);
    camera.position.y += rand(-game.shake, game.shake);
  }
  renderer.render(inArena ? arena : island, camera);

  ctx.clearRect(0, 0, W, H);
  switch (game.state) {
    case STATES.MENU: drawMenuHud(); break;
    case STATES.OVERWORLD:
    case STATES.DIALOGUE: drawOverworldHud(); break;
    case STATES.MINIGAME: drawMinigameHud(); break;
    case STATES.GAME_OVER: drawGameOverHud(); break;
  }
  if (game.muted) text('MUTED', W - 10, H - 8, { size: 10, color: '#c8bfe0', align: 'right', bold: false });
}

let wasMenu = true;
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(now - last, 250);
  last = now;
  while (acc >= STEP) {
    update();
    // snap the follow camera the first time we leave the menu
    if (wasMenu && game.state === STATES.OVERWORLD) { followCamera(true); wasMenu = false; }
    pressed.clear();
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
