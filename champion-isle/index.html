<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champion Isle 3D</title>
<style>
  :root {
    --bg: #0d0b1a;
    --frame: #f0a020;
    --frame-dark: #8a4a10;
    --glow: rgba(240, 160, 32, 0.35);
    --text: #f4ecd8;
    --muted: #9a8fb0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 40%, #1d1838 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Courier New", Courier, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; overflow: hidden;
  }
  #gameContainer {
    position: relative;
    border: 4px solid var(--frame);
    box-shadow: 0 0 0 4px var(--frame-dark), 0 0 30px var(--glow);
    background: #000; line-height: 0;
  }
  #gameCanvas, #hudCanvas {
    display: block;
    width: min(94vw, calc((100vh - 70px) * 800 / 480));
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #hudCanvas { position: absolute; left: 0; top: 0; pointer-events: none; }
  .hint { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-align: center; padding: 0 12px; }
  .hint b { color: var(--frame); }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="480"></canvas>
  <canvas id="hudCanvas" width="800" height="480"></canvas>
</div>
<div class="hint">
  <b>WASD / Arrows</b> move &nbsp;·&nbsp; <b>E</b> talk / advance &nbsp;·&nbsp; <b>Space</b> start / action
  &nbsp;·&nbsp; <b>Esc</b> leave &nbsp;·&nbsp; <b>M</b> sound on/off
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

/* =========================================================
   CORE SETUP
   ========================================================= */
const canvas = document.getElementById('gameCanvas');
const hud = document.getElementById('hudCanvas');
const ctx = hud.getContext('2d');
const W = 800, H = 480;
const COLS = 25, ROWS = 15;
ctx.imageSmoothingEnabled = false;

if (!window.THREE) {
  ctx.fillStyle = '#120e26'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f0a020'; ctx.font = 'bold 20px "Courier New", monospace'; ctx.textAlign = 'center';
  ctx.fillText('Could not load the 3D engine.', W / 2, H / 2 - 10);
  ctx.fillStyle = '#f4ecd8'; ctx.font = '14px "Courier New", monospace';
  ctx.fillText('Check your internet connection and refresh the page.', W / 2, H / 2 + 20);
  throw new Error('THREE not loaded');
}

const STATES = Object.freeze({
  MENU: 'MENU', OVERWORLD: 'OVERWORLD', MINIGAME: 'MINIGAME',
  DIALOGUE: 'DIALOGUE', GAME_OVER: 'GAME_OVER'
});
const game = {
  state: STATES.MENU, tick: 0, stateTick: 0,
  beaten: new Set(), wins: 0, losses: 0,
  talked: new Set(), sport: 'tt', actors: null,
  doorArmed: true, shake: 0, muted: false, result: null, orbit: null
};
function setState(s) { game.state = s; game.stateTick = 0; }

/* =========================================================
   UTILITIES (HUD drawing on the 2D overlay canvas)
   ========================================================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
function hash(x, y, s = 0) {
  let h = Math.imul(x + s * 31, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function px(x, y, w, h, c, g = ctx) {
  g.fillStyle = c;
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function pixelCircle(cx, cy, r, c, g = ctx, step = 2) {
  g.fillStyle = c;
  for (let dy = -r; dy < r; dy += step) {
    const yy = dy + step / 2;
    const hw = Math.round(Math.sqrt(Math.max(0, r * r - yy * yy)) / step) * step;
    g.fillRect(Math.round(cx - hw), Math.round(cy + dy), hw * 2, step);
  }
}
function text(str, x, y, { size = 16, color = '#fff', align = 'left', shadow = '#000', bold = true } = {}) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px "Courier New", monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, x + 2, y + 2); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function panel(x, y, w, h, border = '#f0a020', fill = '#120e26') {
  px(x, y, w, h, border);
  px(x + 3, y + 3, w - 6, h - 6, '#000');
  px(x + 5, y + 5, w - 10, h - 10, fill);
}
function bar(x, y, w, h, frac, color, bg = '#3a3370') {
  px(x, y, w, h, '#000');
  px(x + 2, y + 2, w - 4, h - 4, bg);
  px(x + 2, y + 2, (w - 4) * clamp(frac, 0, 1), h - 4, color);
}
function wrap(str, maxW) {
  const words = str.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
// Arrow icon: 0 up, 1 down, 2 left, 3 right
function drawArrow(cx, cy, dir, s, color) {
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.rotate([-Math.PI / 2, Math.PI / 2, Math.PI, 0][dir]);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, -s * 0.85); ctx.lineTo(-s * 0.7, s * 0.85); ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function keyBox(cx, cy, dir, state) {
  const border = state === 'done' ? '#5cdc6a' : state === 'fail' ? '#e04848' : state === 'now' ? '#ffd84a' : '#3a3370';
  panel(cx - 22, cy - 22, 44, 44, border, state === 'done' ? '#1f4a2a' : state === 'fail' ? '#4a1f1f' : '#120e26');
  drawArrow(cx, cy, dir, 11, state === 'todo' ? '#9a8fb0' : '#ffffff');
}

/* =========================================================
   INPUT
   ========================================================= */
const held = new Set(), pressed = new Set();
const BLOCK = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  initAudio();
  if (!e.repeat) pressed.add(e.code);
  held.add(e.code);
});
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => held.clear());
const isDown = (...c) => c.some(k => held.has(k));
const hit = (...c) => c.some(k => pressed.has(k));
const UP = ['ArrowUp', 'KeyW'], DOWN = ['ArrowDown', 'KeyS'];
const LEFT = ['ArrowLeft', 'KeyA'], RIGHT = ['ArrowRight', 'KeyD'];
function pressedDir() {
  if (hit(...UP)) return 0;
  if (hit(...DOWN)) return 1;
  if (hit(...LEFT)) return 2;
  if (hit(...RIGHT)) return 3;
  return -1;
}

/* =========================================================
   AUDIO (Web Audio chiptune blips)
   ========================================================= */
let actx = null;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur = 0.08, type = 'square', vol = 0.06, slide = 0, delay = 0) {
  if (!actx || game.muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  blip: (f = 880) => tone(f, 0.03, 'square', 0.03),
  select: () => { tone(523, 0.08); tone(784, 0.12, 'square', 0.06, 0, 0.08); },
  move: () => tone(440, 0.04, 'square', 0.04),
  good: () => tone(988, 0.06, 'square', 0.05, 200),
  hit: () => tone(620, 0.05, 'square', 0.07, 120),
  hitAI: () => tone(440, 0.05, 'square', 0.07, 80),
  bounce: () => tone(900, 0.025, 'triangle', 0.08),
  twang: () => tone(220, 0.12, 'triangle', 0.09, 380),
  thud: () => tone(140, 0.1, 'square', 0.08, -60),
  splash: () => tone(1400, 0.05, 'triangle', 0.04, -900),
  wall: () => tone(300, 0.03, 'triangle', 0.07),
  score: () => { tone(784, 0.08); tone(988, 0.08, 'square', 0.06, 0, 0.08); tone(1319, 0.16, 'square', 0.06, 0, 0.16); },
  miss: () => { tone(330, 0.1, 'square', 0.06, -80); tone(220, 0.18, 'square', 0.06, -60, 0.1); },
  count: () => tone(660, 0.08, 'square', 0.05),
  go: () => tone(1046, 0.18, 'square', 0.06),
  win: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.12, 'square', 0.06, 0, i * 0.11)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.16, 'square', 0.06, 0, i * 0.15))
};

/* =========================================================
   2D HUD PARTICLES (confetti on the results screen)
   ========================================================= */
let hudParticles = [];
function hudBurst(x, y, color, n = 12, spd = 3, grav = 0) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd + 0.5;
    hudParticles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: grav, life: 1,
      decay: 0.012 + Math.random() * 0.02, size: (Math.random() * 3 + 3) | 0, color });
  }
}
function updateHudParticles() {
  for (let i = hudParticles.length - 1; i >= 0; i--) {
    const p = hudParticles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.97;
    p.life -= p.decay;
    if (p.life <= 0) hudParticles.splice(i, 1);
  }
}
function drawHudParticles() {
  for (const p of hudParticles) { ctx.globalAlpha = Math.max(0, p.life); px(p.x, p.y, p.size, p.size, p.color); }
  ctx.globalAlpha = 1;
}

/* =========================================================
   2D PIXEL SPRITES (portraits)
   ========================================================= */
function makeSprite(rows, pal) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x];
    if (ch === '.' || !pal[ch]) continue;
    g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1);
  }
  return c;
}
function drawSprite(spr, x, y, scale = 3) {
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, Math.round(x), Math.round(y), spr.width * scale, spr.height * scale);
}
const CAT_SPRITE = makeSprite([
  '.k........k.', 'kok......kbk', 'kookkkkkkbbk', 'koowwwwwwbbk', 'kwwkwwwwkwwk', 'kwwkwwwwkwwk',
  'kwwwwppwwwwk', '.kwwwwwwwwk.', '.kwoowwbbwk.', '.kwoowwbbwk.', '.kwwwkkwwwk.', '.kkk....kkk.'
], { k: '#1b1420', w: '#f6efe0', o: '#e8822e', b: '#2b2530', p: '#f39ab4' });
const CHAMP_ROWS = [
  '.kk......kk.', 'kbbk....kbbk', 'kbrrrrrrrrbk', 'kttttttttttk', 'kbbbttttbbbk', 'kbwbttttbwbk',
  'kttttkkttttk', '.kttccccttk.', '.kggggggggk.', '.kgggrrgggk.', '.kggggggggk.', '.kkk....kkk.'
];
const isLight = c => { const n = parseInt(c.slice(1), 16); return ((n >> 16) & 255) + ((n >> 8) & 255) + (n & 255) > 480; };
const eyeColor = p => isLight(p.mask) ? '#1b1420' : '#ffffff';
const makePortrait = p => makeSprite(CHAMP_ROWS, { k: '#1b1420', b: p.mask, r: p.accent, t: p.fur, w: eyeColor(p), c: p.muzzle, g: p.outfit });

/* =========================================================
   CHAMPIONS + EVENTS
   ========================================================= */
const ORDER = ['tt', 'archery', 'skate', 'rugby', 'climb', 'swim', 'run', 'judo'];
const CHAMPS = {
  tt: { name: 'COACH TANUKI', sport: 'TABLE TENNIS', tile: [16, 5],
    pal: { fur: '#b07a4a', mask: '#4a3428', accent: '#e0403a', muzzle: '#f1dcb4', outfit: '#f2f2f2' },
    taunt: 'Ha! Come back when your paws are faster!' },
  archery: { name: 'KITSUNE KAI', sport: 'ARCHERY', tile: [5, 5],
    pal: { fur: '#e8822e', mask: '#ffffff', accent: '#ffd84a', muzzle: '#ffffff', outfit: '#3f8f3f' },
    taunt: 'The wind whispers. You simply did not listen.',
    intro: ['Hmph. A cat with a bow? This I must see.', 'I am KITSUNE KAI. My arrows never stray from the gold.',
      'Five arrows each. Hold to steady your aim, and mind the wind.'],
    beat: 'Your aim was truer than mine today.' },
  skate: { name: 'RIPPLE THE OTTER', sport: 'SKATEBOARD', tile: [20, 5],
    pal: { fur: '#8a5a3a', mask: '#5a3a22', accent: '#30d0f0', muzzle: '#e8d0b0', outfit: '#7a4ac8' },
    taunt: 'Gnarly try, dude. But the street is mine!',
    intro: ['Yo! A cat on four wheels? Radical.', "I'm RIPPLE THE OTTER. I've landed every trick on this street.",
      'Hit the ramps and punch in the arrow combos before you land.'],
    beat: 'Whoa... that line was SICK. Respect.' },
  rugby: { name: 'BIG BORU', sport: 'RUGBY', tile: [8, 9],
    pal: { fur: '#7a6a5a', mask: '#3a3030', accent: '#ffffff', muzzle: '#d8a0a0', outfit: '#c8302a' },
    taunt: 'HRRMPH! Nobody gets past my line!',
    intro: ['HRRMPH! You think you can get past MY line?', 'I am BIG BORU. My team has never let a try through.',
      'Three plays. Score two tries and the scroll is yours. SPACE to sidestep!'],
    beat: 'HRRMPH... you are slipperier than an eel.' },
  climb: { name: 'SAGE THE GOAT', sport: 'CLIMBING', tile: [20, 9],
    pal: { fur: '#f2f2e8', mask: '#9a9aa8', accent: '#f0a020', muzzle: '#e8e0d0', outfit: '#3060c0' },
    taunt: 'Baa. The mountain does not hurry. Nor did you.',
    intro: ['Baa. The summit is quiet. I like it that way.', 'I am SAGE THE GOAT. No one climbs faster on this rock.',
      'Alternate your paws, and hold fast when stones fall.'],
    beat: 'Baa! The summit is yours. Well climbed.' },
  swim: { name: 'SHELLY THE TURTLE', sport: 'SWIMMING', tile: [9, 12],
    pal: { fur: '#5cae4a', mask: '#2c6b30', accent: '#ffd84a', muzzle: '#d8e8a0', outfit: '#1f8f9b' },
    taunt: 'Slow on land, rocket in water! Better luck next splash!',
    intro: ['Oh, hello! Fancy a little dip?', "I'm SHELLY THE TURTLE. Slow on land, rocket in water!",
      "Time your strokes in the green, and don't forget to breathe."],
    beat: 'Splendid! You swim like a fish... a cat fish!' },
  run: { name: 'HARU THE HARE', sport: 'MARATHON', tile: [18, 12],
    pal: { fur: '#d8d8e0', mask: '#a0a0b0', accent: '#ffffff', muzzle: '#ffe0e8', outfit: '#e05a9a' },
    taunt: 'Hop hop! Pace yourself next time!',
    intro: ['Hop hop! Can you keep up?', "I'm HARU THE HARE. I never lose a race... well, almost never.",
      "Tap SPACE to run, but don't burn out. W to jump the hurdles!"],
    beat: 'You out-paced me! I need a carrot and a nap.' },
  judo: { name: 'MASTER KUMA', sport: 'JUDO', tile: [16, 9],
    pal: { fur: '#6a4a30', mask: '#3a2818', accent: '#1b1420', muzzle: '#c8a078', outfit: '#f2f2f2' },
    taunt: 'Balance is everything. Yours was lacking.',
    intro: ['...', 'I am MASTER KUMA. Balance is everything.',

for (const k of ORDER) CHAMPS[k].portrait = makePortrait(CHAMPS[k].pal);

/* =========================================================
   THREE.JS RENDERER + SHARED 3D HELPERS
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 200);

const matCache = {};
function mat(color, emissive) {
  const key = color + (emissive || '');
  if (!matCache[key]) matCache[key] = new THREE.MeshLambertMaterial({ color, emissive: emissive || 0x000000 });
  return matCache[key];
}
const UNIT_BOX = new THREE.BoxGeometry(1, 1, 1);
function box(w, h, d, color, x = 0, y = 0, z = 0, parent = null, material = null) {
  const m = new THREE.Mesh(UNIT_BOX, material || mat(color));
  m.scale.set(w, h, d);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
function addLights(scene, sky, ground, shadowSize) {
  scene.add(new THREE.HemisphereLight(sky, ground, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(7, 14, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const s = sun.shadow.camera;
  s.left = -shadowSize; s.right = shadowSize; s.top = shadowSize; s.bottom = -shadowSize;
  s.near = 1; s.far = 60; s.updateProjectionMatrix();
  scene.add(sun); scene.add(sun.target);
  return sun;
}

/* ---------- 3D particle pool ---------- */
function makeParticlePool(scene, count = 160) {
  const pool = [];
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(UNIT_BOX, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    m.visible = false; scene.add(m);
    pool.push({ m, vx: 0, vy: 0, vz: 0, life: 0, decay: 0, size: 0.08 });
  }
  return pool;
}
function burst3D(pool, x, y, z, color, n = 12, spd = 0.08) {
  let made = 0;
  for (const p of pool) {
    if (made >= n) break;
    if (p.life > 0) continue;
    const a = Math.random() * Math.PI * 2, e = rand(-0.3, 1.2), s = rand(0.3, 1) * spd;
    p.vx = Math.cos(a) * Math.cos(e) * s; p.vz = Math.sin(a) * Math.cos(e) * s; p.vy = Math.sin(e) * s + 0.02;
    p.life = 1; p.decay = rand(0.02, 0.045); p.size = rand(0.05, 0.11);
    p.m.material.color.set(color);
    p.m.position.set(x, y, z); p.m.visible = true;
    made++;
  }
}
function updatePool(pool) {
  for (const p of pool) {
    if (p.life <= 0) continue;
    p.m.position.x += p.vx; p.m.position.y += p.vy; p.m.position.z += p.vz;
    p.vy -= 0.004; p.vx *= 0.96; p.vz *= 0.96;
    p.life -= p.decay;
    const s = Math.max(0.001, p.size * p.life);
    p.m.scale.set(s, s, s);
    p.m.rotation.x += 0.2; p.m.rotation.y += 0.15;
    if (p.life <= 0) p.m.visible = false;
  }
}
function clearPool(pool) { for (const p of pool) { p.life = 0; p.m.visible = false; } }

/* ---------- voxel characters ---------- */
function legPivot(parent, x, z, color) {
  const pivot = new THREE.Group();
  pivot.position.set(x, 0.24, z);
  box(0.12, 0.24, 0.12, color, 0, -0.12, 0, pivot);
  parent.add(pivot);
  return pivot;
}
function makeCat() {
  const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  box(0.46, 0.34, 0.62, '#f6efe0', 0, 0.39, 0, body);
  box(0.3, 0.05, 0.32, '#e8822e', -0.07, 0.57, -0.04, body);
  box(0.22, 0.05, 0.22, '#2b2530', 0.1, 0.57, -0.2, body);
  const head = new THREE.Group(); head.position.set(0, 0.68, 0.32); body.add(head);
  box(0.48, 0.4, 0.4, '#f6efe0', 0, 0, 0, head);
  box(0.25, 0.12, 0.42, '#e8822e', -0.12, 0.15, 0, head);
  box(0.2, 0.1, 0.42, '#2b2530', 0.13, 0.16, 0, head);
  box(0.13, 0.15, 0.08, '#e8822e', -0.16, 0.27, -0.04, head);
  box(0.13, 0.15, 0.08, '#2b2530', 0.16, 0.27, -0.04, head);
  box(0.07, 0.09, 0.02, '#1b1420', -0.1, 0.03, 0.205, head);
  box(0.07, 0.09, 0.02, '#1b1420', 0.1, 0.03, 0.205, head);
  box(0.07, 0.04, 0.02, '#f39ab4', 0, -0.06, 0.205, head);
  const legs = [legPivot(body, -0.14, 0.2, '#f6efe0'), legPivot(body, 0.14, 0.2, '#f6efe0'),
    legPivot(body, -0.14, -0.2, '#e8822e'), legPivot(body, 0.14, -0.2, '#f6efe0')];
  const tail = new THREE.Group(); tail.position.set(0, 0.48, -0.31); body.add(tail);
  box(0.08, 0.08, 0.26, '#e8822e', 0, 0.06, -0.12, tail).rotation.x = -0.6;
  box(0.09, 0.09, 0.12, '#2b2530', 0, 0.2, -0.24, tail).rotation.x = -0.9;
  return { group: g, body, head, legs, tail };
}
function makeChampion(p) {
  const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  const eye = eyeColor(p);

/* =========================================================
   DIALOGUE SYSTEM
   ========================================================= */
const dlg = { speaker: '', portrait: null, lines: [], i: 0, shown: 0, onDone: null, onLeave: null };
function openDialogue(speaker, portrait, lines, onDone = null, onLeave = null) {
  Object.assign(dlg, { speaker, portrait, lines, i: 0, shown: 0, onDone, onLeave });
  setState(STATES.DIALOGUE);
}
function updateDialogue() {
  const line = dlg.lines[dlg.i];
  if (dlg.shown < line.length) {
    const before = Math.floor(dlg.shown);
    dlg.shown = Math.min(line.length, dlg.shown + 0.8);
    const now = Math.floor(dlg.shown);
    if (now !== before && now % 2 === 0 && line[now - 1] !== ' ') SFX.blip(dlg.portrait ? 520 : 880);
  }
  if (hit('Escape')) {
    setState(STATES.OVERWORLD);
    if (dlg.onLeave) dlg.onLeave();
    return;
  }
  if (hit('KeyE', 'Enter')) {
    if (dlg.shown < line.length) { dlg.shown = line.length; return; }
    dlg.i++; dlg.shown = 0;
    SFX.blip(660);
    if (dlg.i >= dlg.lines.length) {
      setState(STATES.OVERWORLD);
      if (dlg.onDone) dlg.onDone();
    }
  }
}
function drawDialogue() {
  const bx = 24, by = H - 132, bw = W - 48, bh = 112;
  panel(bx, by, bw, bh);
  let tX = bx + 22;
  if (dlg.portrait) {
    panel(bx + 12, by + 12, 88, 88, '#3a3370', '#2a2550');
    drawSprite(dlg.portrait, bx + 20, by + 20 + Math.round(Math.sin(game.tick / 10)), 6);
    tX = bx + 116;
  }
  ctx.font = 'bold 14px "Courier New", monospace';
  const nw = ctx.measureText(dlg.speaker).width + 28;
  panel(bx + 12, by - 24, nw, 30, '#f0a020', '#e0403a');
  text(dlg.speaker, bx + 26, by - 4, { size: 14, color: '#fff' });
  ctx.font = 'bold 17px "Courier New", monospace';
  const lines = wrap(dlg.lines[dlg.i], bx + bw - tX - 24);
  let left = Math.floor(dlg.shown);
  lines.forEach((ln, li) => {
    if (left <= 0) return;
    text(ln.slice(0, left), tX, by + 36 + li * 22, { size: 17, color: '#f4ecd8' });
    left -= ln.length + 1;
  });
  if (dlg.shown >= dlg.lines[dlg.i].length && Math.floor(game.tick / 20) % 2 === 0) {
    text('▼ E', bx + bw - 54, by + bh - 14, { size: 14, color: '#ffd84a' });
  }
  if (dlg.onLeave) text('ESC: leave', bx + bw - 170, by + bh - 14, { size: 12, color: '#9a8fb0' });
}

  shoot(who, hx, hy) {
    const g = new THREE.Group();

  },
  land() {
    const A = SP.arrow, d = Math.hypot(A.hx, A.hy);
    const pts = d < 0.24 ? 10 : d < 0.48 ? 8 : d < 0.72 ? 6 : d < 0.96 ? 4 : d < 1.2 ? 2 : 0;
    (A.who === 'you' ? SP.you : SP.them).push(pts);
    burst3D(arenaParticles, A.p1[0], A.p1[1], A.p1[2] + 0.1, pts === 10 ? '#ffd84a' : '#ffffff', pts ? 14 : 6, 0.07);
    SFX.thud(); if (pts >= 8) SFX.good();
    shakeIt(pts === 10 ? 0.12 : 0.04);
    const who = A.who === 'you' ? '' : 'CHAMP: ';
    banner(pts === 10 ? `${who}BULLSEYE! 10` : pts === 0 ? `${who}MISS!` : `${who}${pts}`, 55, A.who === 'you' ? '#ffd84a' : '#e8822e');
    SP.last = A.who; SP.phase = 'next'; SP.wait = 60;

    SP.t++;

    if (SP.bannerT > 0) SP.bannerT--;
    if (SP.phase === 'ready') { if (readyTick()) SP.phase = 'aim'; return; }
    if (SP.phase === 'aim') {
      const down = isDown('Space');
      if (down) SP.drawT++;
      const steady = SP.drawT > 0 ? clamp(1 - SP.drawT / 45, 0.2, 1) + Math.max(0, (SP.drawT - 150) / 70) : 1;
      SP.ax = (Math.sin(SP.t * 0.05) * 0.95 + Math.sin(SP.t * 0.13) * 0.18) * steady;
      SP.ay = (Math.cos(SP.t * 0.037) * 0.75 + Math.sin(SP.t * 0.11) * 0.14) * steady;
      if (!down && SP.wasDown) { this.shoot('you', SP.ax + SP.wind * 0.35 + rand(-0.04, 0.04), SP.ay + rand(-0.04, 0.04)); SP.drawT = 0; }
      SP.wasDown = down;
    } else if (SP.phase === 'champ') {
      if (--SP.wait <= 0) {
        const a = rand(0, 6.283), d = Math.sqrt(-2 * Math.log(1 - Math.random())) * 0.37;
        this.shoot('them', Math.cos(a) * d, Math.sin(a) * d);
      }
    } else if (SP.phase === 'fly') {
      const A = SP.arrow;
      A.u = Math.min(1, A.u + 1 / 26);
      const p = [0, 1, 2].map(i => lerp(A.p0[i], A.p1[i], A.u));
      p[1] += Math.sin(Math.PI * A.u) * 0.35;
      A.g.position.set(p[0], p[1], p[2]);
      A.g.lookAt(A.p1[0], A.p1[1] - (1 - A.u) * 0.3, A.p1[2]);
      if (A.u >= 1) this.land();
    } else if (SP.phase === 'next') {
      if (--SP.wait <= 0) {
        if (SP.last === 'you') { SP.phase = 'champ'; SP.wait = 50; }
        else {
          SP.round++;
          const sy = SP.you.reduce((a, b) => a + b, 0), st = SP.them.reduce((a, b) => a + b, 0);

            SP.wind = rand(-1, 1); SP.phase = 'aim'; SP.drawT = 0; SP.wasDown = false;
          }
        }
      }
    } else if (SP.phase === 'end') {
      if (--SP.timer <= 0) {
        const sy = SP.you.reduce((a, b) => a + b, 0), st = SP.them.reduce((a, b) => a + b, 0);

      }

    animateCritter(a.cat, false, 0); animateCritter(a.champ, false, 0);

  hud() {

    panel(170, 6, 460, 64, '#f0a020', '#120e26');
    text('YOU', 184, 30, { size: 13, color: '#30a0f0' });

    panel(8, 80, 124, 54, '#3a3370');

    text(`${Math.round(Math.abs(SP.wind) * 12)} mph`, 66, 102, { size: 12, color: '#f4ecd8' });

    if (SP.phase === 'aim') {

    SP.defs = [{ m: a.champ, boss: true }];
    for (let i = 0; i < 7; i++) { const m = makeChampion(CHAMPS.rugby.pal); sg.add(m.group); SP.defs.push({ m }); }
    Object.assign(SP, { play: 1, tries: 0, timer: 150 });
    this.setup();
  },
  setup() {
    Object.assign(SP, { x: 0, z: 0, dashT: 0, dashCd: 0, dashDir: 1, flop: 0 });
    const count = 4 + SP.play;
    SP.defs.forEach((d, i) => {
      d.active = d.boss || i <= count;
      d.m.group.visible = d.active;
      if (d.boss) { d.x = rand(-2, 2); d.z = TRY_Z + 4; d.speed = 0.058 + SP.play * 0.004; }
      else { d.z = -8 - (i - 1) * (26 / count); d.x = rand(-5, 5); d.speed = 0.034 + SP.play * 0.006 + rand(0, 0.01); }
      d.face = 0; d.moving = false;
      d.m.group.rotation.set(0, 0, 0);
    });
    game.actors.cat.group.rotation.set(0, Math.PI, 0);
  },
  update() {
    SP.t++;
    if (SP.bannerT > 0) SP.bannerT--;
    camera.position.set(SP.x * 0.5, 4.6, SP.z + 7); camera.lookAt(SP.x * 0.4, 0.4, SP.z - 5);
    aimSun(SP.x, 0, SP.z - 4);
    if (SP.phase === 'ready') { if (readyTick()) SP.phase = 'run'; return; }
    if (SP.phase === 'run') {
      const lat = (isDown(...RIGHT) ? 1 : 0) - (isDown(...LEFT) ? 1 : 0);
      if (hit('Space') && SP.dashCd <= 0) {
        SP.dashT = 12; SP.dashCd = 70; SP.dashDir = lat || (SP.x > 0 ? -1 : 1);
        SFX.move(); burst3D(arenaParticles, SP.x, 0.2, SP.z, '#ffffff', 8, 0.05);
      }
      let vx = lat * 0.085;
      if (SP.dashT > 0) { vx = SP.dashDir * 0.24; SP.dashT--; }
      SP.dashCd--;
      const vz = -(isDown(...UP) ? 0.11 : isDown(...DOWN) ? 0.07 : 0.095);
      SP.x = clamp(SP.x + vx, -6.6, 6.6); SP.z += vz;
      for (const d of SP.defs) {
        if (!d.active) continue;
        d.moving = false;
        const ahead = SP.z - d.z;   // > 0 while the defender is still in front of you
        if (ahead > -0.4 && ahead < 10) {
          const gx = SP.x + vx * 4, gz = SP.z + vz * 4;
          const ang = Math.atan2(gx - d.x, gz - d.z);
          d.x += Math.sin(ang) * d.speed; d.z += Math.cos(ang) * d.speed; d.face = ang; d.moving = true;
        } else if (ahead <= -0.4 && ahead > -6) {   // beaten defenders give a tired chase
          const ang = Math.atan2(SP.x - d.x, SP.z - d.z);
          d.x += Math.sin(ang) * d.speed * 0.5; d.z += Math.cos(ang) * d.speed * 0.5; d.face = ang; d.moving = true;
        }
        if (Math.hypot(SP.x - d.x, SP.z - d.z) < (d.boss ? 0.7 : 0.55)) {
          SP.phase = 'over'; SP.timer = 100; SP.flop = 1;
          banner('TACKLED!', 80, '#e04848'); shakeIt(0.3); SFX.miss();
          burst3D(arenaParticles, SP.x, 0.3, SP.z, '#d6c49a', 20, 0.1);
          break;
        }
      }
      if (SP.phase === 'run' && SP.z <= TRY_Z) {
        SP.tries++; SP.phase = 'over'; SP.timer = 110;
        banner('TRY!', 90); SFX.score();
        burst3D(arenaParticles, SP.x, 0.5, SP.z, '#ffd84a', 30, 0.14);
        burst3D(arenaParticles, SP.x, 0.5, SP.z, '#30a0f0', 20, 0.12);
      }
    } else if (SP.phase === 'over') {
      if (--SP.timer <= 0) {
        const fails = SP.play - SP.tries;
        if (SP.tries >= 2 || fails >= 2) { finishSport(SP.tries >= 2, `${SP.tries} tries in ${SP.play} plays`); return; }
        SP.play++; this.setup(); SP.phase = 'ready'; SP.timer = 120;
      }
    }
  },
  visuals() {
    const a = game.actors;
    a.cat.group.position.set(SP.x, SP.phase === 'over' && SP.flop === 0 ? Math.abs(Math.sin(SP.t * 0.2)) * 0.5 : 0, SP.z);
    a.cat.group.rotation.z = SP.flop ? Math.PI / 2 : 0;
    animateCritter(a.cat, SP.phase === 'run', SP.t, 0.5);
    for (const d of SP.defs) {
      if (!d.active) continue;
      d.m.group.position.set(d.x, 0, d.z);
      d.m.group.rotation.y = d.face;
      animateCritter(d.m, d.moving, SP.t + d.x * 10, 0.45);
    }
  },
  hud() {
    panel(8, 8, 200, 62);
    text(`PLAY ${SP.play}/3`, 22, 32, { size: 16, color: '#ffd84a' });
    text('TRIES', 22, 56, { size: 13, color: '#c8bfe0' });
    for (let i = 0; i < 2; i++) px(84 + i * 18, 45, 12, 12, i < SP.tries ? '#5cdc6a' : '#3a3370');
    const dist = Math.max(0, Math.round(SP.z - TRY_Z));
    panel(W - 160, 8, 152, 40, '#3a3370');
    text(`${dist} m to go`, W - 84, 33, { size: 15, color: '#f4ecd8', align: 'center' });
    text('DASH', W - 150, 72, { size: 12, color: '#c8bfe0' });
    bar(W - 104, 60, 96, 14, 1 - Math.max(0, SP.dashCd) / 70, SP.dashCd <= 0 ? '#5cdc6a' : '#9a8fb0');
    hint('A/D dodge · W sprint · SPACE sidestep · score 2 tries to win');
    drawReady('Reach the try line! A/D to dodge · SPACE to sidestep');
    drawBanner(H / 2, 48);
  },
  focus: () => ({ x: SP.x, y: 0.6, z: SP.z, r: 6 })
};

    a.cat.legs[0].rotation.x = ps; a.cat.legs[3].rotation.x = ps; a.cat.legs[1].rotation.x = -ps; a.cat.legs[2].rotation.x = -ps;
    a.champ.legs[0].rotation.x = cs; a.champ.legs[3].rotation.x = cs; a.champ.legs[1].rotation.x = -cs; a.champ.legs[2].rotation.x = -cs;
    a.cat.tail.rotation.y = Math.sin(game.tick / 9) * 0.5;
    SP.rock.visible = SP.rockY !== null;
    if (SP.rockY !== null) { SP.rock.position.y = SP.rockY + 0.4; SP.rock.rotation.x += 0.1; SP.rock.rotation.z += 0.07; }
  },
  hud() {

    drawLane(16, SP.ph, '#30a0f0', 'YOU');

    text(`${Math.round(SP.ph)} / ${CL_TOP} m`, 60, 340, { size: 13, color: '#f4ecd8' });
    if (SP.rockY !== null && Math.floor(SP.t / 6) % 2) text('!', W / 2 - 60, 120, { size: 40, color: '#e04848', align: 'center' });

    drawBanner(H / 2 - 30, 40);
  },
  focus: () => ({ x: 0, y: Math.min(Math.max(SP.ph, SP.ch), CL_TOP) + 0.5, z: 0.5, r: 6 })

    if (hit(...UP) && SP.jumpT <= 0) { SP.jumpT = 34; SFX.move(); }
    SP.v = clamp(SP.v * 0.993, 0, 0.22);
    if (SP.exhaust > 0) { SP.exhaust--; SP.v = Math.min(SP.v, 0.05); }
    if (SP.v > 0.165) SP.sta -= 0.007; else SP.sta = Math.min(1, SP.sta + 0.0025);
    if (SP.sta <= 0) { SP.sta = 0.25; SP.exhaust = 100; banner('EXHAUSTED!', 70, '#e04848'); SFX.miss(); }
    const prev = SP.x;
    SP.x += SP.trip > 0 ? SP.v * 0.5 : SP.v;
    if (SP.trip > 0) SP.trip--;
    if (SP.jumpT > 0) SP.jumpT--;
    for (const hd of SP.hurdles) {
      if (prev < hd.x && SP.x >= hd.x) {
        if (SP.jumpT > 4 && SP.jumpT < 31) { SFX.good(); }
        else { SP.v *= 0.3; SP.trip = 30; hd.knocked[0] = true; shakeIt(0.2); banner('TRIPPED!', 45, '#e04848'); SFX.thud(); burst3D(arenaParticles, hd.x, 0.4, 0.9, '#ffffff', 10, 0.07); }
      }
    }
    // champion: steady pace, auto-jumps, sometimes clips a hurdle
    const cprev = SP.cx;
    SP.cv = lerp(SP.cv, 0.135 + Math.sin(SP.t * 0.02) * 0.008, 0.03);
    SP.cx += SP.ctrip > 0 ? SP.cv * 0.5 : SP.cv;
    if (SP.ctrip > 0) SP.ctrip--;
    if (SP.cjumpT > 0) SP.cjumpT--;
    for (const hd of SP.hurdles) {
      if (SP.cjumpT <= 0 && hd.x - SP.cx > 0 && hd.x - SP.cx < SP.cv * 17) SP.cjumpT = 34;
      if (cprev < hd.x && SP.cx >= hd.x && Math.random() < 0.08) { SP.ctrip = 30; SP.cv *= 0.4; hd.knocked[1] = true; }
    }
    if (SP.x >= RUN_END || SP.cx >= RUN_END) {
      SP.phase = 'end'; SP.timer = 90;
      const won = SP.x >= RUN_END;
      banner(won ? 'PHOTO FINISH... YOU!' : 'HARU WINS!', 90, won ? '#ffd84a' : '#e04848');
      won ? SFX.score() : SFX.miss();
    }
  },
  visuals() {
    const a = game.actors;
    const jy = t => t > 0 ? Math.sin(Math.PI * (34 - t) / 34) * 0.8 : 0;
    a.cat.group.position.set(Math.min(SP.x, RUN_END + 2), jy(SP.jumpT), 0.9);
    a.champ.group.position.set(Math.min(SP.cx, RUN_END + 2), jy(SP.cjumpT), -0.9);
    a.cat.group.rotation.z = SP.trip > 0 ? -0.4 : 0;
    a.champ.group.rotation.z = SP.ctrip > 0 ? -0.4 : 0;
    animateCritter(a.cat, SP.v > 0.01 && SP.jumpT <= 0, SP.t, 0.2 + SP.v * 3);
    animateCritter(a.champ, SP.phase !== 'ready' && SP.cjumpT <= 0, SP.t, 0.55);
    for (const hd of SP.hurdles) hd.meshes.forEach((m, i) => { if (hd.knocked[i]) m.rotation.z = lerp(m.rotation.z, -1.4, 0.2); });
  },
  hud() {
    panel(8, 8, 250, 84);
    text('PACE', 22, 32, { size: 13, color: '#c8bfe0' });
    const bx = 80, bw = 164;
    px(bx, 20, bw, 16, '#000'); px(bx + 2, 22, bw - 4, 12, '#2a2550');
    px(bx + 2 + (bw - 4) * (0.12 / 0.22), 22, (bw - 4) * (0.045 / 0.22), 12, '#2a6a3a');
    px(bx + 2 + (bw - 4) * (0.165 / 0.22), 22, (bw - 4) * (0.055 / 0.22), 12, '#6a2a2a');
    px(bx + 2 + (bw - 4) * (SP.v / 0.22) - 2, 17, 4, 22, '#ffffff');
    text('STAMINA', 22, 58, { size: 13, color: '#c8bfe0' });
    bar(110, 46, 134, 16, SP.sta, SP.exhaust > 0 ? '#9a8fb0' : SP.sta > 0.3 ? '#5cdc6a' : '#e04848');
    text(`${Math.max(0, Math.round(RUN_END - SP.x))} m to go`, 22, 84, { size: 13, color: '#f4ecd8' });
    panel(W - 248, 8, 240, 62, '#3a3370');
    text('YOU', W - 236, 31, { size: 11, color: '#30a0f0' }); bar(W - 186, 20, 170, 14, SP.x / RUN_END, '#30a0f0');
    text('HARU', W - 236, 55, { size: 11, color: '#e05a9a' }); bar(W - 186, 44, 170, 14, SP.cx / RUN_END, '#e05a9a');
    hint('Tap SPACE to run · stay in the green pace zone · W to jump hurdles');
    drawReady('Tap SPACE to run · keep pace in the green · W to jump');
    drawBanner(H / 2 - 40, 34);
  },
  focus: () => ({ x: Math.min(SP.x, RUN_END), y: 0.6, z: 0, r: 6 })
};

/* =========================================================
   SPORT 8: JUDO
   ========================================================= */
SPORTS.judo = {
  start() {
    setSky('#2a1f3d', 14, 30); aimSun(0, 0, 0);
    ground('#7a5a3a', 40, 40);
    box(7.6, 0.12, 7.6, '#c8302a', 0, 0.06, 0, sg).castShadow = false;
    box(7, 0.15, 7, '#c8c070', 0, 0.075, 0, sg).castShadow = false;
    for (let i = -3; i <= 3; i++) box(0.03, 0.152, 7, '#a8a050', i, 0.076, 0, sg).castShadow = false;
    box(16, 5, 0.3, '#efe6d2', 0, 2.5, -5, sg);
    for (const x of [-6, -2, 2, 6]) box(0.3, 5, 0.35, '#5a3a22', x, 2.5, -4.95, sg);
    box(16, 0.3, 0.4, '#5a3a22', 0, 4.9, -4.9, sg);
    box(2.4, 1.2, 0.05, '#f4f4f4', 0, 3.2, -4.8, sg);
    pixelDiscBanner();
    const a = addActors('judo');
    a.cat.group.rotation.y = Math.PI / 2; a.champ.group.rotation.y = -Math.PI / 2;
    a.cat.group.scale.setScalar(1.3); a.champ.group.scale.setScalar(1.3);
    Object.assign(SP, { bal: 0, you: 0, them: 0, timer: 150, atk: -1, atkT: 140, win: 0, throwT: 0, thrower: null });
    function pixelDiscBanner() {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.04, 20), mat('#e0403a'));
      m.rotation.x = Math.PI / 2; m.position.set(0, 3.2, -4.76); sg.add(m);
    }
  },
  resetPose() {
    const a = game.actors;
    a.cat.group.rotation.set(0, Math.PI / 2, 0); a.champ.group.rotation.set(0, -Math.PI / 2, 0);
  },
  update() {
    SP.t++;
    if (SP.bannerT > 0) SP.bannerT--;
    camera.position.set(SP.bal * 0.3, 3.4, 6.4); camera.lookAt(SP.bal * 0.3, 0.9, 0);
    if (SP.phase === 'ready') { if (readyTick()) { SP.phase = 'fight'; banner('HAJIME!', 50); } return; }
    if (SP.phase === 'fight') {
      if (hit('Space')) { SP.bal += 0.05; if (SP.t % 2 === 0) SFX.blip(400); }
      SP.bal -= 0.0045 + (Math.random() < 0.01 ? 0.05 : 0);
      if (SP.atk < 0) {
        if (--SP.atkT <= 0) {
          SP.atk = Math.floor(rand(0, 4));
          SP.win = SP.winMax = Math.max(26, 48 - (SP.you + SP.them) * 6);
          SFX.wall();
        }
      } else {
        const d = pressedDir();
        if (d === SP.atk) {
          SP.bal += 0.35; banner('COUNTER!', 40, '#5cdc6a'); SFX.hit(); shakeIt(0.1);
          burst3D(arenaParticles, SP.bal * 0.5, 1.2, 0, '#ffd84a', 12, 0.08);
          SP.atk = -1; SP.atkT = Math.floor(rand(130, 210));
        } else if (d >= 0 || --SP.win <= 0) {
          SP.bal -= 0.4; banner('GRABBED!', 40, '#e04848'); SFX.hitAI(); shakeIt(0.12);
          SP.atk = -1; SP.atkT = Math.floor(rand(130, 210));
        }
      }
      if (SP.bal >= 1 || SP.bal <= -1) {
        SP.thrower = SP.bal >= 1 ? 'you' : 'them';
        SP.thrower === 'you' ? SP.you++ : SP.them++;
        SP.phase = 'throw'; SP.throwT = 0; SP.atk = -1;
        banner('IPPON!', 90, SP.thrower === 'you' ? '#ffd84a' : '#e04848');
        SFX.thud(); shakeIt(0.35);
      }
    } else if (SP.phase === 'throw') {
      SP.throwT++;
      if (SP.throwT === 40) { burst3D(arenaParticles, SP.thrower === 'you' ? 1.6 : -1.6, 0.3, 0, '#f4f4f4', 24, 0.12); SFX.thud(); }
      if (SP.throwT >= 110) {
        if (SP.you >= 2 || SP.them >= 2) { finishSport(SP.you >= 2, `${SP.you} - ${SP.them} in throws`); return; }
        SP.bal = 0; this.resetPose(); SP.phase = 'ready'; SP.timer = 90; SP.atkT = Math.floor(rand(110, 180));
      }
    }
    SP.bal = clamp(SP.bal, -1, 1);
  },
  visuals() {
    const a = game.actors, off = SP.bal * 0.6;
    if (SP.phase === 'throw') {
      const p = Math.min(1, SP.throwT / 40);
      const winner = SP.thrower === 'you' ? a.cat : a.champ, loser = SP.thrower === 'you' ? a.champ : a.cat;
      const dir = SP.thrower === 'you' ? 1 : -1;
      winner.group.position.set(off - dir * 0.75 + dir * 0.75, 0.15, 0);
      loser.group.position.set(lerp(off + dir * 0.75, off + dir * 2.0, p), 0.15 + Math.sin(p * Math.PI) * 1.4, 0);
      loser.group.rotation.z = dir * p * Math.PI;
    } else {
      a.cat.group.position.set(off - 0.75, 0.15, 0);
      a.champ.group.position.set(off + 0.75, 0.15, 0);
      a.cat.body.rotation.x = 0.15 + Math.max(0, SP.bal) * 0.2;
      a.champ.body.rotation.x = 0.15 + Math.max(0, -SP.bal) * 0.2;
    }
    const struggle = SP.phase === 'fight';
    animateCritter(a.cat, struggle, SP.t, 0.6);
    animateCritter(a.champ, struggle, SP.t + 3, 0.6);
  },
  hud() {
    const bx = W / 2 - 200, by = 70;
    panel(bx - 8, by - 12, 416, 42, '#f0a020');
    px(bx, by, 400, 18, '#000');
    px(bx + 2, by + 2, 198, 14, '#4a1f1f'); px(bx + 200, by + 2, 198, 14, '#1f3a4a');
    px(bx + 200 + SP.bal * 196 - 3, by - 4, 6, 26, '#ffffff');
    text('KUMA', bx - 16, by + 14, { size: 12, color: '#e04848', align: 'right' });
    text('YOU', bx + 418, by + 14, { size: 12, color: '#30a0f0' });
    panel(W / 2 - 90, 6, 180, 42, '#3a3370');
    text('IPPON', W / 2, 22, { size: 11, color: '#c8bfe0', align: 'center' });
    for (let i = 0; i < 2; i++) {
      px(W / 2 - 70 + i * 16, 28, 12, 12, i < SP.you ? '#30a0f0' : '#2a2550');
      px(W / 2 + 34 + i * 16, 28, 12, 12, i < SP.them ? '#e04848' : '#2a2550');
    }
    if (SP.atk >= 0) {
      keyBox(W / 2, H / 2 - 40, SP.atk, 'now');
      bar(W / 2 - 40, H / 2 - 8, 80, 8, SP.win / SP.winMax, '#e04848');
      text('COUNTER!', W / 2, H / 2 - 74, { size: 18, color: '#ffd84a', align: 'center' });
    }
    hint('MASH SPACE to push · press the shown ARROW to counter a grab · 2 ippon wins');
    drawReady('MASH SPACE to push · press the ARROW shown to counter');
    drawBanner(H / 2 + 60, 44);
  },
  focus: () => ({ x: 0, y: 0.8, z: 0, r: 6 })
};

/* =========================================================
   GAME OVER STATE
   ========================================================= */
function returnToIsland() {
  const key = game.sport;
  if (key === 'tt') { player.x = tx(13); player.z = tz(5) + 0.1; }
  else { const [c, r] = CHAMPS[key].tile; player.x = tx(c); player.z = tz(r) + 1; }
  player.angle = 0;
  game.doorArmed = false;
  clearPool(islandParticles);
  followCamera(true);
  setState(STATES.OVERWORLD);
}
function updateGameOver() {
  const r = game.result, o = game.orbit, a = game.actors;
  if (r && r.won && game.stateTick % 8 === 0) {
    const cols = ['#ffd84a', '#30a0f0', '#e0403a', '#5cdc6a', '#f39ab4'];
    hudBurst(rand(40, W - 40), rand(-10, 60), cols[Math.floor(rand(0, cols.length))], 6, 2, 0.08);
  }
  const ang = game.stateTick * 0.006;
  camera.position.set(o.x + Math.sin(ang) * o.r, o.y + 3.5, o.z + Math.cos(ang) * o.r);
  camera.lookAt(o.x, o.y, o.z);
  aimSun(o.x, 0, o.z);
  const jump = Math.abs(Math.sin(game.stateTick / 9)) * 0.5;
  if (a) {
    if (a.cat.baseY !== undefined) a.cat.group.position.y = a.cat.baseY + (r.won ? jump : 0);
    if (a.champ.baseY !== undefined) a.champ.group.position.y = a.champ.baseY + (!r.won ? jump : 0);
  }
  if (game.sport === 'tt') { mg.ball.visible = false; ballMesh.visible = false; trail.forEach(t => (t.visible = false)); ttCrowd(); }
  updatePool(arenaParticles);
  if (game.stateTick > 30) {
    if (hit('Space', 'Enter')) { SFX.select(); returnToIsland(); }
    else if (hit('KeyR')) { SFX.select(); startSport(game.sport); }
  }
}
function drawScroll(cx, cy) {
  px(cx - 40, cy - 24, 80, 48, '#f1dcb4'); px(cx - 40, cy - 24, 80, 4, '#d6b96c');
  for (let i = 0; i < 4; i++) px(cx - 28, cy - 12 + i * 8, 56 - (i % 2) * 14, 3, '#a0582a');
  px(cx - 48, cy - 30, 10, 60, '#e0403a'); px(cx + 38, cy - 30, 10, 60, '#e0403a');
  px(cx - 46, cy - 34, 6, 4, '#ffd84a'); px(cx + 40, cy - 34, 6, 4, '#ffd84a');
  px(cx - 46, cy + 30, 6, 4, '#ffd84a'); px(cx + 40, cy + 30, 6, 4, '#ffd84a');
}
function drawGameOverHud() {
  const r = game.result, c = CHAMPS[r.key];
  ctx.globalAlpha = 0.6; px(0, 0, W, H, r.won ? '#1a1436' : '#120c18'); ctx.globalAlpha = 1;
  if (r.won) {
    text('VICTORY!', W / 2, 92, { size: 56, color: '#ffd84a', align: 'center', shadow: '#7a2a10' });
    text(`You beat ${c.name}  ·  ${r.detail}`, W / 2, 132, { size: 17, color: '#f4ecd8', align: 'center' });
    drawScroll(W / 2, 224 + Math.round(Math.sin(game.tick / 15) * 4));
    drawSprite(CAT_SPRITE, W / 2 - 160, 196, 5);
    drawSprite(c.portrait, W / 2 + 100, 196, 5);
    text(r.first ? `${c.sport} SCROLL OBTAINED!` : 'CHAMPION DEFEATED AGAIN!', W / 2, 312, { size: 20, color: '#5cdc6a', align: 'center' });
    if (game.beaten.size === 8) text('ALL 8 SCROLLS! YOU ARE THE CHAMPION OF THE ISLE!', W / 2, 340, { size: 16, color: '#ffd84a', align: 'center' });
  } else {
    text('DEFEAT', W / 2, 92, { size: 56, color: '#e04848', align: 'center', shadow: '#3a0a0a' });
    text(`${c.name} wins  ·  ${r.detail}`, W / 2, 132, { size: 17, color: '#f4ecd8', align: 'center' });
    drawSprite(c.portrait, W / 2 - 36, 170 - Math.round(Math.abs(Math.sin(game.tick / 8)) * 6), 6);
    text(`"${c.taunt}"`, W / 2, 312, { size: 15, color: '#ffd84a', align: 'center' });
  }
  text(`SCROLLS ${game.beaten.size}/8   ·   RECORD  W ${game.wins} - L ${game.losses}`, W / 2, 368, { size: 14, color: '#c8bfe0', align: 'center' });
  if (Math.floor(game.tick / 30) % 2 === 0) {
    text('SPACE: Return to Island     R: Rematch', W / 2, 414, { size: 18, color: '#ffffff', align: 'center', shadow: '#e0403a' });
  }
  drawHudParticles();
}

/* =========================================================
   MAIN LOOP (fixed 60 Hz update, render every frame)
   ========================================================= */
function update() {
  game.tick++; game.stateTick++;
  if (hit('KeyM')) game.muted = !game.muted;
  updateHudParticles();
  switch (game.state) {
    case STATES.MENU: updateMenu(); break;
    case STATES.OVERWORLD: updateOverworld(); break;
    case STATES.DIALOGUE: updateDialogue(); break;
    case STATES.MINIGAME:
      if (hit('Escape')) { returnToIsland(); break; }
      SPORTS[game.sport].update();
      if (game.state === STATES.MINIGAME) { SPORTS[game.sport].visuals(); updatePool(arenaParticles); }
      break;
    case STATES.GAME_OVER: updateGameOver(); break;
  }
  if (game.state === STATES.MENU || game.state === STATES.OVERWORLD || game.state === STATES.DIALOGUE) {
    updateIslandVisuals();
    if (game.state !== STATES.MENU) followCamera();
  }
  game.shake *= 0.85;
  if (game.shake < 0.005) game.shake = 0;
}
function render() {
  const inArena = game.state === STATES.MINIGAME || game.state === STATES.GAME_OVER;
  if (game.shake) {
    camera.position.x += rand(-game.shake, game.shake);
    camera.position.y += rand(-game.shake, game.shake);
  }
  renderer.render(inArena ? arena : island, camera);
  ctx.clearRect(0, 0, W, H);
  switch (game.state) {
    case STATES.MENU: drawMenuHud(); break;
    case STATES.OVERWORLD:
    case STATES.DIALOGUE: drawOverworldHud(); break;
    case STATES.MINIGAME:
      SPORTS[game.sport].hud();
      if (game.sport !== 'tt') text('ESC: forfeit', W - 12, H - 30, { size: 11, color: '#c8bfe0', align: 'right', bold: false });
      break;
    case STATES.GAME_OVER: drawGameOverHud(); break;
  }
  if (game.muted) text('MUTED', W - 10, H - 8, { size: 10, color: '#c8bfe0', align: 'right', bold: false });
}

let wasMenu = true;
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(now - last, 250);
  last = now;
  while (acc >= STEP) {
    update();
    if (wasMenu && game.state === STATES.OVERWORLD) { followCamera(true); wasMenu = false; }
    pressed.clear();
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
